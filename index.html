    const steps=`<div class="steps">${[0,1,2].map(i=>`<i class="${i===step?"on":""}"></i>`).join("")}</div>`;
    let body="";
    if(step===0) body=`<div class="stack" style="gap:14px"><svg width="56" height="56" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="10" fill="var(--accent)"/><path d="M5 18h6l2.5-6 4 12 3-9 2 3H29" fill="none" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h2 id="obHello" style="font-family:var(--f-display);font-size:24px">${G("Dobrodošla!","Dobrodošao!","Dobrodošao/la!")}</h2>
      <p style="margin:0">Ovde je sav materijal za državni ispit, pretvoren u <b>testove, vežbanje i rezimee</b>: ${TESTABLE.length} pitanja sa ponuđenim odgovorima iz ${DOCS.length} dokumenata. Samo zaokružuješ.</p>
      <p class="muted" style="margin:0">Ispod svakog pitanja piše iz kog je dokumenta i sa koje strane, pa uvek možeš da proveriš.</p>
      ${PROF.active?`<div class="flat row" style="gap:12px;padding:10px 12px">${avatarHTML(st.name,1)}<div class="grow"><div class="eyebrow">Profil</div><b class="notr">${esc(st.name)}</b></div></div>`
        :`<div class="stack" style="gap:6px"><div class="eyebrow">Kako se zoveš?</div><input class="field" id="obName" maxlength="30" placeholder="Tvoje ime" autocomplete="off" autocapitalize="words" enterkeyhint="next"><div class="muted small">Napredak se čuva posebno za svako ime.</div><button class="link" id="obRestore" style="align-self:flex-start">${I.upload}Već si ${G("učila","učio","učio/la")}? Vrati sačuvan napredak</button></div>`}</div>`;
    if(step===1) body=`<div class="stack" style="gap:14px"><h2 style="font-size:22px">Podesi učenje</h2>
      <div class="stack" style="gap:6px"><div class="eyebrow">Koliko pitanja dnevno?</div><div class="seg" id="obGoal"><button data-v="50">50</button><button data-v="100">100</button><button data-v="150">150</button><button data-v="200">200</button></div><div class="muted small">Do petka je preporuka 100–150 dnevno.</div></div>
      <div class="stack" style="gap:6px"><div class="eyebrow">Pismo</div><div class="seg" id="obScript"><button data-v="lat">Latinica</button><button data-v="cyr">Ćirilica</button></div></div>
      <div class="stack" style="gap:6px"><div class="eyebrow">Tema</div><div class="seg" id="obTheme"><button data-v="system">Kao telefon</button><button data-v="light">Svetla</button><button data-v="dark">Tamna</button></div></div></div>`;
    if(step===2) body=`<div class="stack" style="gap:12px"><h2 style="font-size:22px">Kako da učiš</h2>
      <div class="row" style="align-items:flex-start"><span class="ic">${I.check}</span><div><b>Svaki dan ispuni „Plan za danas”.</b><div class="muted small">Zadaci se sami štikliraju dok učiš.</div></div></div>
      <div class="row" style="align-items:flex-start"><span class="ic" style="background:var(--bad-soft);color:var(--bad)">${I.redo}</span><div><b>Greške se vraćaju dok ih ne naučiš.</b><div class="muted small">Češće dobijaš ono što ne znaš.</div></div></div>
      <div class="row" style="align-items:flex-start"><span class="ic" style="background:var(--ecg-soft);color:var(--ecg)">${I.flag}</span><div><b>Prvo pitanja sa pravih rokova.</b><div class="muted small">Ta su već bila na ispitu.</div></div></div>
      <div class="row" style="align-items:flex-start"><span class="ic" style="background:var(--gold-soft);color:var(--gold)">${I.star}</span><div><b>Zvezdicom čuvaš teška pitanja.</b><div class="muted small">Posle ih imaš u „Sačuvana”.</div></div></div>
      ${STANDALONE?"":`<div class="note">${PWA?"Savet: u Safariju dodirni ikonicu za deljenje, pa „Dodaj na početni ekran”. Tako dobijaš pravu aplikaciju sa ikonicom, i radi bez interneta.":APP_URL?"Aplikacija postoji i kao prava aplikacija za telefon (radi bez interneta). Link je na početnom ekranu.":""}</div>`}</div>`;
    const needName=step===0&&!PROF.active;
    box.innerHTML=`<div class="stack" style="gap:18px">${steps}${body}<div class="${needName?"":"grid2"}">${step>0?`<button class="btn" id="obBack">Nazad</button>`:needName?"":`<button class="btn" id="obSkip">Preskoči</button>`}<button class="btn primary${needName?" block":""}" id="obNext">${step<2?"Dalje":"Počni da učiš"}</button></div></div>`;
    const mark=(id,val)=>box.querySelectorAll(`#${id} button`).forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===String(val))));
    if(step===1){mark("obGoal",st.goal);mark("obScript",st.script);mark("obTheme",st.theme);
      box.querySelectorAll("#obGoal button").forEach(b=>b.onclick=()=>{st.goal=+b.dataset.v;mark("obGoal",st.goal)});
      box.querySelectorAll("#obScript button").forEach(b=>b.onclick=()=>{st.script=b.dataset.v;refreshAll();draw()});
      box.querySelectorAll("#obTheme button").forEach(b=>b.onclick=()=>{st.theme=b.dataset.v;applyTheme();mark("obTheme",st.theme)})}
    const nm=box.querySelector("#obName"); if(nm) nm.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();box.querySelector("#obNext").click()}});
    if(nm) nm.addEventListener("input",()=>{ const g=guessG(nm.value), pick=(f,m,b)=>g==="f"?f:g==="m"?m:b;
      const hh=box.querySelector("#obHello"); if(hh){hh.textContent=pick("Dobrodošla!","Dobrodošao!","Dobrodošao/la!"); applyScript(hh)}
      const rr=box.querySelector("#obRestore"); if(rr){rr.innerHTML=I.upload+`Već si ${pick("učila","učio","učio/la")}? Vrati sačuvan napredak`; applyScript(rr)} });
    const done=()=>{st.onboarded=true;st.t=Date.now();save();s.remove();go("home")};
    box.querySelector("#obNext").onclick=async()=>{
      if(busy)return;
      if(needName){ const name=cleanName(nm.value); if(!slugOf(name)){toast("Upiši ime");nm.focus();return}
        busy=true; const b=box.querySelector("#obNext"); b.disabled=true; b.textContent="Otvaram…";
        const known=!!PROF.list[slugOf(name)];
        const pr=openProfile(name); await Promise.race([pr,wait(5000)]); busy=false; st=S.settings;
        if(st.onboarded){ s.remove(); go("home"); toast(`Zdravo, ${st.name}! Tvoj napredak je učitan.`); return }
        if(known)toast(`Zdravo, ${st.name}!`);
        step=1; draw(); return }
      if(step<2){step++;draw()} else done() };
    const bk=box.querySelector("#obBack"); if(bk)bk.onclick=()=>{step--;draw()};
    const rs=box.querySelector("#obRestore"); if(rs)rs.onclick=()=>restoreSheet();
    const sk=box.querySelector("#obSkip"); if(sk)sk.onclick=done;
    applyScript(box);
  }
  document.body.appendChild(s); draw();
}
function applyTheme(){const t=S.settings.theme; if(t==="system")document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme",t); document.documentElement.style.setProperty("--z",String(S.settings.fs||1));
  const bg=getComputedStyle(document.documentElement).getPropertyValue("--bg").trim(); document.querySelectorAll('meta[name="theme-color"]').forEach(m=>{ if(t==="system"){ if(m.dataset.c)m.content=m.dataset.c } else { if(!m.dataset.c)m.dataset.c=m.content; m.content=bg } })}
matchMedia("(prefers-color-scheme: dark)").addEventListener&&matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>applyTheme());

/* ============ rezervna kopija (i prenos napretka u aplikaciju) ============ */
function backupText(){
  flush();
  const data={app:"skr",v:1,t:Date.now(),active:PROF.active,profiles:{}};
  Object.keys(PROF.list).forEach(slug=>{ const o=slug===PROF.active?S:readLocal(slug); if(o)data.profiles[slug]={name:PROF.list[slug].name,state:o} });
  return JSON.stringify(data);
}
async function backupSave(){
  if(!Object.keys(PROF.list).length){toast("Još nema napretka za čuvanje");return}
  const text=backupText(), name=`drzavni-ispit-napredak-${today()}.json`;
  if(!PWA){ // u Claude-u fajl se čuva preko Claude-a
    try{ const dl=window.claude&&typeof window.claude.use==="function"?await window.claude.use("downloads"):null;
      if(dl){ await dl.save({filename:name,data:text}); toast("Napredak je sačuvan u fajl"); return } }
    catch(e){ const c=e&&e.code; if(c==="declined")return; if(c==="rate_limited"){toast("Sačekaj trenutak pa pokušaj ponovo");return} }
    backupTextSheet(text); return;
  }
  const blob=new Blob([text],{type:"application/json"});
  const file=typeof File==="function"?new File([blob],name,{type:"application/json"}):null;
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){ navigator.share({files:[file],title:"Državni ispit – napredak"}).then(()=>toast("Kopija je sačuvana"),()=>{}); return }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000); toast("Kopija je sačuvana");
}
function backupTextSheet(text){
  text=text||backupText();
  const s=sheet(`<h2 style="font-size:20px">Napredak kao tekst</h2>
    <p class="muted small" style="margin:0">Kopiraj ovaj tekst, pa ga u aplikaciji nalepi u Podešavanja → Rezervna kopija → „Nalepi tekst”.</p>
    <textarea class="field" id="bkTxt" readonly style="min-height:140px;font-family:var(--f-mono);font-size:12px"></textarea>
    <div class="grid2"><button class="btn" id="no">Zatvori</button><button class="btn primary" id="cp">Kopiraj</button></div>`,"Napredak kao tekst");
  const ta=s.querySelector("#bkTxt"); ta.value=text;
  s.querySelector("#no").onclick=()=>s.remove();
  s.querySelector("#cp").onclick=()=>{ const ok=()=>toast("Kopirano – sad ga nalepi u aplikaciji");
    const fallback=()=>{ ta.removeAttribute("readonly"); ta.focus(); ta.select(); ta.setSelectionRange(0,ta.value.length); let r=false; try{r=document.execCommand("copy")}catch(e){} ta.setAttribute("readonly",""); r?ok():toast("Označi ceo tekst i izaberi „Copy”") };
    try{ navigator.clipboard.writeText(text).then(ok,fallback) }catch(e){ fallback() } };
  applyScript(s); document.body.appendChild(s);
}
function importBackup(text){
  let d; try{d=JSON.parse(String(text||"").trim())}catch(e){toast("Ovo nije sačuvan napredak");return false}
  if(!d||d.app!=="skr"||!d.profiles){toast("Ovo nije sačuvan napredak");return false}
  let n=0, first=""; flush();
  Object.keys(d.profiles).forEach(k=>{ const p=d.profiles[k]; const nm=cleanName(p&&p.name); const slug=slugOf(nm); if(!slug||!p.state)return;
    const cur=slug===PROF.active?S:(readLocal(slug)||freshState(nm)); const m=mergeState(cur,p.state); const nm2=(PROF.list[slug]&&PROF.list[slug].name)||nm; m.settings.name=nm2;
    PROF.list[slug]=Object.assign(PROF.list[slug]||{name:nm2,c:Date.now()},{u:Math.max(m.upd||0,(PROF.list[slug]||{}).u||0)});
    if(slug===PROF.active){S=m;writeLocal()} else lsSet(skey(slug),JSON.stringify(m)); n++; if(!first||k===d.active)first=slug });
  saveProfiles();
  if(!PROF.active&&first){ document.querySelectorAll(".scrim").forEach(x=>x.remove()); openProfile(PROF.list[first].name) }
  applyTheme(); updateAvatar(); go("home"); toast(n?`Napredak je vraćen (${n} ${n===1?"ime":"imena"})`:"U kopiji nema napretka");
  return n>0;
}
function backupLoad(f){ const r=new FileReader(); r.onload=()=>importBackup(r.result); r.readAsText(f) }
function restoreSheet(){
  const s=sheet(`<h2 style="font-size:20px">Vrati sačuvan napredak</h2>
    <p class="muted small" style="margin:0">Izaberi fajl koji si ${G("sačuvala","sačuvao","sačuvao/la")} (npr. u Files), ili nalepi tekst koji si ${G("kopirala","kopirao","kopirao/la")}.</p>
    <button class="btn primary block" id="rsFile">${I.upload}Izaberi fajl</button><input type="file" id="rsIn" accept=".json,application/json,text/plain" hidden>
    <div class="eyebrow">ili nalepi tekst</div>
    <textarea class="field" id="rsTxt" placeholder="Ovde nalepi kopirani napredak" style="min-height:110px;font-family:var(--f-mono);font-size:12px"></textarea>
    <div class="grid2"><button class="btn" id="no">Otkaži</button><button class="btn primary" id="rsGo">Vrati napredak</button></div>`,"Vrati napredak");
  const inp=s.querySelector("#rsIn");
  s.querySelector("#rsFile").onclick=()=>inp.click();
  inp.onchange=()=>{const f=inp.files&&inp.files[0]; if(f){ const r=new FileReader(); r.onload=()=>{ if(importBackup(r.result)) s.remove() }; r.readAsText(f) }};
  s.querySelector("#no").onclick=()=>s.remove();
  s.querySelector("#rsGo").onclick=()=>{ const t=s.querySelector("#rsTxt").value; if(!t.trim()){toast("Prvo nalepi tekst");return} if(importBackup(t)) s.remove() };
  applyScript(s); document.body.appendChild(s);
}

/* ============ instalirana aplikacija: rad bez interneta i nove verzije ============ */
function initPWA(){
  if(!PWA)return;
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{}) }catch(e){}
  if(!("serviceWorker" in navigator)||(location.protocol!=="https:"&&location.hostname!=="localhost"))return;
  const ready=w=>{ if(document.querySelector(".upd"))return; const b=h(`<button class="upd">Nova verzija aplikacije je spremna · <b>Osveži</b></button>`); b.onclick=()=>{flush(); w.postMessage("skip"); b.remove()}; applyScript(b); document.body.appendChild(b) };
  navigator.serviceWorker.register("sw.js").then(reg=>{
    if(reg.waiting&&navigator.serviceWorker.controller) ready(reg.waiting);
    reg.addEventListener("updatefound",()=>{ const w=reg.installing; if(w) w.addEventListener("statechange",()=>{ if(w.state==="installed"&&navigator.serviceWorker.controller) ready(w) }) });
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") reg.update().catch(()=>{}) });
  }).catch(()=>{});
  let reloading=false; navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(reloading||!navigator.serviceWorker.controller)return; reloading=true; flush(); location.reload() });
}
function refreshAll(){ $("#title").textContent="Državni ispit"; $("#subtitle").textContent="Medicinska sestra-tehničar"; $("#btnStats").setAttribute("aria-label","Statistika"); $("#btnSettings").setAttribute("aria-label","Podešavanja"); applyScript($("#top")); updateTabs(); if(!["quiz","deck"].includes(current))go(current,{keep:true}) }

/* ============ confetti ============ */
function confetti(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.createElement("canvas");c.className="confetti";document.body.appendChild(c);const dpr=Math.min(2,window.devicePixelRatio||1);
  c.width=innerWidth*dpr;c.height=innerHeight*dpr;const x=c.getContext("2d");x.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement);const cols=["--accent","--ecg","--gold","--good","--warn"].map(v=>cs.getPropertyValue(v).trim()||"#0A7A6E");
  const ps=Array.from({length:130},()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.35,vx:(Math.random()-.5)*11,vy:-Math.random()*11-4,r:Math.random()*6+4,c:cols[Math.random()*cols.length|0],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  const t0=performance.now();
  (function f(t){const e=t-t0;x.clearRect(0,0,innerWidth,innerHeight);ps.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.globalAlpha=Math.max(0,1-e/1800);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(e<1800)requestAnimationFrame(f);else c.remove()})(t0);
}

/* ============ keyboard ============ */
document.addEventListener("keydown",e=>{
  if(e.target.closest&&e.target.closest("input,textarea")||e.metaKey||e.ctrlKey||e.altKey)return;
  if(document.querySelector(".scrim"))return;
  if((current==="quiz"&&quiz)||(current==="deck"&&fcs)){
    const k=e.key.toLowerCase(); const map={a:0,b:1,c:2,d:3,e:4,"1":0,"2":1,"3":2,"4":3,"5":4};
    if(k in map){const b=document.querySelectorAll(".qcard .opt")[map[k]]; if(b&&!b.disabled){b.click();e.preventDefault()}}
    else if(k==="enter"||k===" "){const b=document.querySelector(".sticky-foot .btn")||document.querySelector(".qcard .btn.primary:not([disabled])"); if(b){b.click();e.preventDefault()}}
  }
});

/* ============ zaključavanje skrola ispod otvorenog prozora ============ */
new MutationObserver(()=>{ const open=!!document.querySelector(".scrim"), locked=document.body.classList.contains("locked");
  if(open&&!locked){ lockY=window.scrollY; document.body.style.top=(-lockY)+"px"; document.body.classList.add("locked") }
  else if(!open&&locked){ document.body.classList.remove("locked"); document.body.style.top=""; window.scrollTo(0,lockY) }
}).observe(document.body,{childList:true});

/* ============ boot ============ */
$("#btnSettings").innerHTML=I.gear+'<span class="syncdot"></span>'; $("#btnSettings").onclick=settings;
$("#btnStats").innerHTML=I.chart; $("#btnStats").onclick=()=>go("stats");
$("#btnProfile").onclick=()=>whoSheet(); updateAvatar();
applyTheme();
const firstInSession=Date.now()-(S.lastOpen||0)>60*60e3&&Object.keys(S.st).length>0;
S.lastOpen=Date.now(); if(PROF.active)save(false);
applyScript($("#top"));
const hash=(location.hash||"").slice(1);
go(["test","cards","learn","search","stats"].includes(hash)?hash:"home");
if(!PROF.active) setTimeout(()=>hasProgress(S)?whoSheet(true):onboarding(),300);
else if(!S.settings.onboarded) setTimeout(onboarding,300);
else if(firstInSession) setTimeout(()=>{ if(current==="home"&&!document.querySelector(".scrim")) surprise() },800);
setTimeout(initSync,0);
initPWA();
})();
</script>
