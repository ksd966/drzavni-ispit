<style>
/* Layout: phone-first app shell — sticky header, one scrolling view, fixed bottom tab bar. ECG-paper grid as the one signature motif. */
:root{
  --bg:#EEF3F2; --surface:#FFFFFF; --surface-2:#F6F9F8; --ink:#12201E; --muted:#5A6B68; --line:#D6E0DE;
  --accent:#0A7A6E; --accent-ink:#FFFFFF; --accent-soft:#D8EEEA;
  --ecg:#D8465A; --ecg-soft:#FBE3E6; --grid:rgba(216,70,90,.10);
  --good:#1E8A4B; --good-soft:#DDF3E5; --bad:#C0392B; --bad-soft:#F9E0DC; --warn:#A8690F; --warn-soft:#FBEBCF;
  --gold:#B8860B; --gold-soft:#FAF0D2;
  --shadow:0 1px 2px rgba(18,32,30,.06),0 6px 20px rgba(18,32,30,.06);
  --f-display:"Unbounded","Onest",system-ui,sans-serif; --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:16px; --z:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1413; --surface:#141F1D; --surface-2:#1A2725; --ink:#E4EEEB; --muted:#98ABA7; --line:#26352F;
  --accent:#3CC4B2; --accent-ink:#06201C; --accent-soft:#16332F;
  --ecg:#FF6F82; --ecg-soft:#3A1D23; --grid:rgba(255,111,130,.07);
  --good:#56C784; --good-soft:#15301F; --bad:#F26D5E; --bad-soft:#3A1C18; --warn:#E6AD4E; --warn-soft:#352914;
  --gold:#E8C35A; --gold-soft:#332A12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1413; --surface:#141F1D; --surface-2:#1A2725; --ink:#E4EEEB; --muted:#98ABA7; --line:#26352F;
  --accent:#3CC4B2; --accent-ink:#06201C; --accent-soft:#16332F;
  --ecg:#FF6F82; --ecg-soft:#3A1D23; --grid:rgba(255,111,130,.07);
  --good:#56C784; --good-soft:#15301F; --bad:#F26D5E; --bad-soft:#3A1C18; --warn:#E6AD4E; --warn-soft:#352914;
  --gold:#E8C35A; --gold-soft:#332A12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
html{background:var(--bg);-webkit-text-size-adjust:100%;touch-action:manipulation}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.btn,.tile,.iconbtn,.big-cta,.resume,.task,.arow,.chip,.prow .pmain,nav.tabs .pill{transition:transform .12s ease,background-color .15s,border-color .15s}
.btn:active,.tile:active,.iconbtn:active,.big-cta:active,.resume:active,.task:active,.arow:active,.chip:active,.prow .pmain:active{transform:scale(.97)}
nav.tabs button:active .pill{transform:scale(.9)}
.install{display:flex;flex-direction:column;gap:10px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:18px;padding:14px 16px}
.install .row b{font-size:16px}
.install ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.install .shr{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--surface);border:1px solid var(--line);vertical-align:-5px;color:var(--accent)}
.install .shr svg{width:14px;height:14px}
.upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:45;border:0;border-radius:14px;background:var(--ink);color:var(--bg);padding:12px 16px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100vw - 32px);animation:up .25s}
input,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
.app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:12px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid transparent}
header.top.scrolled{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand svg{flex:none}
.brand b{display:block;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;position:relative}
.iconbtn svg{width:20px;height:20px}
.iconbtn.on{color:var(--gold);border-color:var(--gold);background:var(--gold-soft)}
.syncdot{position:absolute;right:7px;top:7px;width:8px;height:8px;border-radius:99px;background:var(--muted);border:2px solid var(--surface)}
.syncdot.ok{background:var(--good)}.syncdot.err{background:var(--warn)}
.avatar{--h:170;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:hsl(var(--h) 52% 40%);color:#fff;font-weight:800;font-size:15px;flex:none;line-height:1}
.avatar.lg{width:44px;height:44px;font-size:19px}
.iconbtn.avbtn{border-radius:50%;border-color:transparent;background:none}
.prow{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:0 6px 0 0}
.prow.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.prow .pmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;text-align:left;min-height:64px;color:var(--ink)}
.prow .pmain b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pmain small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.prow .pmark{color:var(--accent);display:grid;place-items:center}.prow .pmark svg{width:22px;height:22px}
.prow .pdel{width:40px;height:40px;border-color:transparent;background:none;color:var(--muted)}
.prow .pdel:hover{color:var(--bad)}
.pnew{display:flex;gap:8px}.pnew .field{flex:1;min-width:0}
main#view{flex:1;padding:8px 16px calc(100px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;zoom:var(--z)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs button{border:0;background:none;padding:6px 2px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);min-height:52px;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button[aria-current="page"] .pill{background:var(--accent-soft)}
nav.tabs .pill{padding:3px 14px;border-radius:999px;display:grid;place-items:center;transition:background .2s;position:relative}
nav.tabs .cnt{position:absolute;top:-2px;right:4px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--ecg);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;font-family:var(--f-mono)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.flat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.h1{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px;border-radius:12px}
.btn.block{width:100%}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45}
.btn svg,.fb .t svg,.li .mark svg{width:20px;height:20px;flex:none}
.link{border:0;background:none;padding:6px 0;color:var(--accent);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.link svg{width:16px;height:16px}
.link.quiet{color:var(--muted);font-weight:600}
.btn:focus-visible,.iconbtn:focus-visible,nav.tabs button:focus-visible,.opt:focus-visible,.tile:focus-visible,.chip:focus-visible,.link:focus-visible,.seg button:focus-visible,.task:focus-visible,.arow:focus-visible,.resume:focus-visible,.big-cta:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}
/* hero */
.greet{font-size:15px;color:var(--muted);font-weight:600;margin:2px 2px -4px}
.greet b{color:var(--ink)}
.hero{position:relative;overflow:hidden;border-radius:20px;padding:18px 18px 16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:12px 12px}
.hero .countrow{display:flex;align-items:center;gap:8px;margin:8px 0 14px}
.hero .count{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.hero .count small{font-size:15px;font-weight:500;letter-spacing:0;margin-left:6px;color:var(--muted);font-family:var(--f-body)}
.hero svg.pulse{position:absolute;right:14px;top:44px;width:100px;height:40px;opacity:.7;pointer-events:none}
.hero>*{position:relative}
.pulse path{fill:none;stroke:var(--ecg);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:no-preference){.pulse path{stroke-dasharray:260;stroke-dashoffset:260;animation:draw 2.4s ease-out .2s forwards}@keyframes draw{to{stroke-dashoffset:0}}}
.bar{height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s}
.bar.thin{height:8px}
.arow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;border:0;background:none;padding:6px 0;text-align:left;width:100%}
.arow .bar{grid-column:1/-1}
.arow b{font-weight:600}
.arow span{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;min-height:92px}
.tile b{font-size:16px;line-height:1.25}
.tile span.s{font-size:13px;color:var(--muted);line-height:1.35}
.tile.h{flex-direction:row;align-items:center;min-height:68px}
.ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.ic svg{width:20px;height:20px}
.hot .ic{background:var(--ecg-soft);color:var(--ecg)}
.warn .ic{background:var(--bad-soft);color:var(--bad)}
.gold .ic{background:var(--gold-soft);color:var(--gold)}
.big-cta{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border:0;border-radius:18px;padding:16px 18px;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.big-cta b{display:block;font-size:18px}
.big-cta span{font-size:14px;opacity:.85}
.big-cta svg{width:28px;height:28px;flex:none}
.resume{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px dashed var(--accent);background:var(--accent-soft);border-radius:16px;padding:12px 14px}
.resume svg{width:24px;height:24px;color:var(--accent);flex:none}
/* plan checklist */
.plan{margin:0;padding:0;display:flex;flex-direction:column}
.plan li{list-style:none}
.task{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 0;text-align:left;border-top:1px solid var(--line)}
.plan li:first-child .task{border-top:0}
.task .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.task.done .box{background:var(--good);border-color:var(--good);color:#fff}
.task .box svg{width:16px;height:16px}
.task.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}
.task .t{font-weight:600;line-height:1.3}
.task .p{font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap}
.task>svg{color:var(--muted);flex:none}
/* badges & chips */
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.badge svg{width:13px;height:13px}
.badge.exam{background:var(--ecg-soft);color:var(--ecg);border-color:transparent}
.badge.hot{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.check{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.badge.area{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.src{font-family:var(--f-mono);font-size:12px;color:var(--muted);line-height:1.5}
.src b{font-weight:600;color:var(--ink)}
/* quiz */
.qtop{display:flex;align-items:center;gap:10px}
.dots{flex:1;display:flex;gap:3px;align-items:center;min-width:0}
.dots i{flex:1;height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);min-width:3px}
.dots i.cur{background:var(--accent-soft);border-color:var(--accent)}
.dots i.ok{background:var(--good);border-color:var(--good)}
.dots i.no{background:var(--bad);border-color:var(--bad)}
.dots i.ans{background:var(--muted);border-color:var(--muted)}
.qnum{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.qtext{font-size:20px;font-weight:650;line-height:1.35}
.qhint{font-size:13px;font-weight:700;color:var(--ecg);text-transform:uppercase;letter-spacing:.05em}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;min-height:56px;font-size:16px;line-height:1.4;transition:transform .08s,border-color .15s,background .15s}
.opt:active{transform:scale(.99)}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--f-mono)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .k{background:var(--good);color:#fff;border-color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.dim{opacity:.55}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)} @keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
  .shake{animation:shake .38s} @keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
}
.fb{border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);background:var(--surface-2)}
.fb.ok{background:var(--good-soft);border-color:transparent}
.fb.no{background:var(--bad-soft);border-color:transparent}
.fb .t{font-weight:800;display:flex;align-items:center;gap:8px}
.fb.ok .t{color:var(--good)} .fb.no .t{color:var(--bad)}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:8px;font-size:14px}
.answer{font-size:17px;line-height:1.45}
.answer ul{margin:4px 0 0;padding-left:20px}
.sticky-foot{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));padding-top:6px;background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:10px}
.timer{font-family:var(--f-mono);font-weight:600;font-size:14px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad);border-color:var(--bad)}
.kbd{font-family:var(--f-mono);font-size:11px;padding:1px 5px;border:1px solid var(--line);border-radius:5px;color:var(--muted)}
@media (hover:none){.kbdhint{display:none}}
/* results */
.score{font-family:var(--f-display);font-weight:700;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.ring{width:132px;height:132px;flex:none}
.ring circle{fill:none;stroke-width:12}
.ring .bgc{stroke:var(--surface-2)}
.ring .fgc{stroke-linecap:round;transition:stroke-dashoffset 1s}
.ring text{font-family:var(--f-display);font-weight:700;fill:var(--ink);font-size:30px}
.list{display:flex;flex-direction:column;gap:10px}
.li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.li .q{font-weight:650}
.li .a{color:var(--good);font-weight:600}
.li .y{color:var(--bad);text-decoration:line-through}
.li .mark{flex:none;width:22px;height:22px;display:grid;place-items:center}
.li.click{cursor:pointer}
/* stats */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi span{font-size:13px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.chart .v{fill:var(--ink);font-weight:600}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.achi{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.achi .ic{background:var(--surface-2);color:var(--muted)}
.achi.on .ic{background:var(--gold-soft);color:var(--gold)}
.achi b{font-size:14px;line-height:1.25}
.achi span{font-size:12px;color:var(--muted);line-height:1.3}
.achi:not(.on){opacity:.7}
/* nivo znanja */
.boxes{display:flex;gap:4px;width:110px}
.boxes i{flex:1;height:6px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.boxes i.on{background:var(--accent);border-color:var(--accent)}
/* learn */
details.acc{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
details.acc summary{list-style:none;padding:14px 16px;font-weight:700;display:flex;align-items:center;gap:10px;cursor:pointer;min-height:52px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary .ic{width:30px;height:30px}
details.acc summary .chev{margin-left:auto;transition:transform .2s;color:var(--muted);flex:none;display:grid}
details.acc[open] summary .chev{transform:rotate(90deg)}
details.acc .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.pct{font-family:var(--f-mono);font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);flex:none}
.pct.good{background:var(--good-soft);color:var(--good)}.pct.mid{background:var(--warn-soft);color:var(--warn)}.pct.low{background:var(--bad-soft);color:var(--bad)}
.numrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.numrow:first-child{border-top:0}
.numrow .nk{font-size:15px;font-weight:600}
.numrow .nv{font-family:var(--f-mono);font-weight:700;color:var(--accent);text-align:right;max-width:46vw;font-size:14px}
.numrow .src{grid-column:1/-1}
mark{background:color-mix(in srgb,var(--warn) 30%,transparent);color:inherit;border-radius:3px;padding:0 1px}
input.field,textarea.field{width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:17px;padding:12px 14px}
textarea.field{min-height:90px;resize:vertical}
input.field:focus,textarea.field:focus{outline:none;border-color:var(--accent)}
.sw{position:relative}
.sw>span{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);display:grid}
.sw>span svg{width:20px;height:20px}
.sw input{padding-left:44px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(6,14,12,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:640px;max-height:90vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .25s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:4px auto 2px;flex:none}
@keyframes up{from{transform:translateY(40px);opacity:.4}} @keyframes fade{from{opacity:0}}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;font-size:14px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);color:var(--accent)}
.steps{display:flex;gap:6px;justify-content:center}
.steps i{width:8px;height:8px;border-radius:99px;background:var(--line);transition:width .2s}
.steps i.on{background:var(--accent);width:22px}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;box-shadow:var(--shadow);animation:up .2s;max-width:calc(100vw - 32px);text-align:center}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-child{border-top:0}
.kv b{font-variant-numeric:tabular-nums;text-align:right}
.fade-in{animation:fade .25s}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

šenja zdravstvenog inspektora o ispunjavanju uslova za obavljanje zdravstvene delatnosti","Ukoliko je ne obnovi na vreme, ako načini stručnu gresku, bude osudjen na krivicno delo, zloupotrebi sredstva zdr osiguranja, ima zabranu samostalnog rada","Kada ne može da utvrdi indetitet, ne može da utvrdi uzok smrti ili posumnja na nasilnu smrti"],"c":[0]},{"id":"943c978","a":"zastita","t":"mc","q":"Udaljenje zaposlenog sa rada može da traje najduže?","s":[[5,21],[12,4]],"f":2,"g":965,"ans":"3 meseca","o":["3 meseca","6 meseci","12 meseci"],"c":[0]},{"id":"a5dcb79","a":"zastita","t":"mc","q":"Radni odnos se zasniva?","s":[[5,21],[12,4]],"f":2,"g":966,"ans":"Zakljucenjem ugovora o radu","o":["Zakljucenjem ugovora o radu","Ambulantu za zdravstvenu negu","Pismeno i bez njegovog trazenja"],"c":[0]},{"id":"53bc867","a":"zastita","t":"qa","q":"Kada zaposlenom miruju prava i obaveze?","s":[[5,21]],"f":1,"g":967,"ans":"Za vreme sluzenja vojnog roka, upućivanja na rad u inostranstvo od strane poslodavca, izdrzavanje kazne zatvora u trajanju do 6 meseci.","noq":1},{"id":"8211f93","a":"zastita","t":"mc","q":"Placeno odsustvo koliko dana može da bude?","s":[[5,21],[12,4]],"f":2,"g":968,"ans":"5 dana za smrt ili bolest užeg člana porodice, sklapanje braka, otac kada dobije dete, 2 dana za dobrovoljno davanje krvi","o":["5 dana za smrt ili bolest užeg člana porodice, sklapanje braka, otac kada dobije dete, 2 dana za dobrovoljno davanje krvi","Najmanje 15 dana od dana koji se navodi kao prestanak radnog odnosa","Sezonski radnik je fizičko lice kojeg poslodavac angažuje za obavljanje sezonskih poslova uz novčanu nadoknadu za rad. Ne duže od 120 radnih dana u godini"],"c":[0]},{"id":"5ed7738","a":"zastita","t":"qa","q":"Kada može da se promeni Ustav?","s":[[5,21],[12,4]],"f":2,"g":969,"ans":"Predlogom 1/3 poslanika. A usvaja se sa 2/3 i mora da prođe referendum od 60 dana. Narodna skupština određuje o promeni.","noq":1},{"id":"d667b31","a":"ustav","t":"qa","q":"Da li je…?","s":[[5,21],[12, a radi obavljanja neke umne ili fizičke delatnisti","Kada osiguranik želi sebi ili svojoj porodici da poveća obim ili druga prava koja ne obuhvata obavezno osiguranje ili ako nema obavezno osiguranje"],"c":[0]},{"id":"7f12b1b","a":"zastita","t":"qa","q":"Pravo na naknadu troškova?","s":[[5,24]],"f":1,"g":1045,"ans":"bolovanje usled bolesti ili povrede van posla, profesionalne povrede ili bolesti na radu, komplikacije u vezi sa trudnoćom, obavezne izolacije, dobrovoljnog davanja tkiva, organa i usled praćenja bolesnog lica. Lekarska komisija daje bolovanje do 6 meseci sve preko toga određuje invalidska komisija.","noq":1},{"id":"c9eb6a8","a":"zastita","t":"qa","q":"Zaposlena žena ima pravo na porodiljsko odsustvo i pravo na odsustvo sa rada radi nege deteta za prvo dete u trajanju od godinu dana, a za treće i svako naredno dve godine.","s":[[5,25]],"f":1,"g":1046,"ans":"Zaposlena žena ima pravo na porodiljsko odsustvo i pravo na odsustvo sa rada radi nege deteta za prvo dete u trajanju od godinu dana, a za treće i svako naredno dve godine.","fact":1},{"id":"cb39e42","a":"zastita","t":"qa","q":"Zaposlena za vreme trudnoće i zaposlena koja doji dete ne može da radi,ako bi takav rad bio štetan za njeno zdravlje i zdravlje deteta, na osnovu nalaza nadležnog zdravstvenog organa prekovremeno i noću.","s":[[5,25]],"f":1,"g":1047,"ans":"Zaposlena za vreme trudnoće i zaposlena koja doji dete ne može da radi,ako bi takav rad bio štetan za njeno zdravlje i zdravlje deteta, na osnovu nalaza nadležnog zdravstvenog organa prekovremeno i noću.","fact":1},{"id":"e6c5fd1","a":"zastita","t":"qa","q":"Zaposleni mlađi od 18 godina života ne može da radi na poslovima na kojima se obavlja naročito težak fizički rad, rad pod zemljom, pod vodom, na velikoj visini…","s":[[5,25]],"f":1,"g":1048,"ans":"Zaposleni mlađi od 18 godina života ne može da radi na poslovima na kojima se obavlja naročito težak fizički rad, rad pod zemljom, pod vodom, na velikoj visini…","fact":1},{"id":"8af1e8b","a":"zastita","t":"qa","q":"Porodiljsko odsustvo traje do navršena 3 meseca od dana porođaja, na to se nadovezuje odsustvo zbog nege deteta do navršenih godinu dana od rođenja deteta.","s":[[5,25]],"f":1,"g":1049,"ans":"Porodiljsko odsustvo traje do navršena 3 meseca od dana porođaja, na to se nadovezuje odsustvo zbog nege deteta do navršenih godinu dana od rođenja deteta.","fact":1},{"id":"f36ffe1","a":"zastita","t":"mc","q":"Pacijent ima pravo da obaveštenje koje mu je…?","s":[[5,25]],"f":1,"g":1050,"ans":"potrebno da bi doneo odluku o pristanku na operaciju dobije od hirurga koji predlaže operaciju.","o":["Potrebno da bi doneo odluku o pristanku na operaciju dobije od hirurga koji predlaže operaciju","Osiguranje kojim se zaposlenima i drugima obezbeđuje pravo za ZZ i novčane naknade za slucajeve utvrđene zakonom","U granicama materijalnih mogućnosti sistema zdravstvene zaštite"],"c":[0]},{"id":"a69fd3e","a":"ustav","t":"qa","q":"Narodni poslanici u Narodnoj Skupštini se biraju na neposrednim izborima, tajnim glasanjem. Biraju se na 4 godine.","s":[[5,25]],"f":1,"g":1051,"ans":"Narodni poslanici u Narodnoj Skupštini se biraju na neposrednim izborima, tajnim glasanjem. Biraju se na 4 godine.","fact":1},{"id":"2a5a41e","a":"ustav","t":"qa","q":"Predsednik Republike se bira bira na neposrednim izborima, tajnim glasanjem. Mandat traje 5 godina i jedna osoba može najviše dva puta da bude izabrana. Predsednik ne može da obavlja drugu javnu funkciju ili profesionalnu delatnost. Kada podnese ostavku on o tome obaveštava javnost i predsednika Narodne Skupštine. Tada njegovu funkciju do izbora, koji moraju da se odrze u roku od 60 dana, preuzima predsednik Narodna skupština.","s":[[5,25]],"f":1,"g":1052,"ans":"Predsednik Republike se bira bira na neposrednim izborima, tajnim glasanjem. Mandat traje 5 godina i jedna osoba može najviše dva puta da bude izabrana. Predsednik ne može da obavlja drugu javnu funkciju ili profesionalnu delatnost. Kada podnese ostavku on o tome obaveštava javnost i predsednika Narodne Skupštine. Tada njegovu funkciju do izbora, koji moraju da se odrze u roku od 60 dana, preuzima predsednik Narodna skupština.","fact":1},{"id":"2cd9b68","a":"ustav","t":"qa","q":"Vladu sačinjavaju predsednik i potpredsednici i ministri. Vlada i svaki njen član odgovaraju za svoj rad Narodna skupština. Poslove državne uprave obavljaju ministarstva.","s":[[5,25]],"f":1,"g":1053,"ans":"Vladu sačinjavaju predsednik i potpredsednici i ministri. Vlada i svaki njen član odgovaraju za svoj rad Narodna skupština. Poslove državne uprave obavljaju ministarstva.","fact":1},{"id":"32c49d5","a":"ustav","t":"mc","q":"Sudovi štite slobode i prava građana, zakonom utvrđena prava i interese i obezbeđuju ustavnost i zakonitost. Sudovi su…?","s":[[5,25]],"f":1,"g":1054,"ans":"samostalni i nezavisni u svom radu i sude na osnovu Ustava, zakona i drugih opštih akata. Vrhovni (kasacioni) Sud Srbije je najviši sud u RS.","o":["Samostalni i nezavisni u svom radu i sude na osnovu Ustava, zakona i drugih opštih akata. Vrhovni (kasacioni) Sud Srbije je najviši sud u Republika Srbija","Prekrsajni, Visi prekrsajni, Privredni, Apelacioni privredni, Upravni Sud","Ministarstvo unutrašnjih poslovi koje obaveštava Sud koji odlučuje o izvodienju obdukcije"],"c":[0]},{"id":"fe956b6","a":"zastita","t":"qa","q":"Prerasporeda radnog vremena ne može vršiti na poslovima na kojima je…?","s":[[5,25]],"f":1,"g":1055,"ans":"uvedeno skraćeno radno vreme, kod mlađih od 18 godina.. Ukupno radno vreme u periodu od 6 meseci ne sme biti duže od 60 sati nedeljno.","noq":1},{"id":"c01f02c","a":"zastita","t":"qa","q":"PRAVA PACIJENATA 1) pravo da dostupnost zz 2) pravo na informacije 3) pravo na preventivne mere 4) pravo na kvalitet pružanja zdr usluge 5) pravo na bezbednost 6) pravo na obaveštenje-da od nadležnog zdr radnika blagovremeno dobije obaveštenje koje mu je potrebno da odluci da pristane ili ne pristane na predloženu medicinsku meru. 7) pravo na slobodan izbor 8) pravo na drugo s osle 38 nedelje trudnoće se postepeno smanjuje zato ga deca rođena pre termina imaju u velikoj količini, dok deca rođena posle 39 nedelje samo u tragovima.","p":16},{"t":"Fontanele> ima ih 6: Velika fontanela koja zarasta između 12-15 meseca, mala fontanela koja zarasta do 3 meseca i dve prednje i dve zadnje fontanele.","p":16},{"t":"Kapnometrija je praćenje CO2 u izdahnutom vazduhu.","p":16},{"t":"DiTePer je vakcina protiv difterije, tetanusa i pertusisa/velikog kašlja. Daje se posle navrsenog 2 meseca, navršenih 3,5 meseca i navršenih 6 meseci. Revakcine u drugoj godini, pre polaska u osnovnu skolu i 14 godini.","p":16},{"t":"MMR vakcina je vakcina protiv morbila/malih boginja, zausaka i rubeole. Prva doza u drugoj godini(posle navršenih 12 meseci), revakcina pre upisa u prvi razred osnovne škole.","p":16},{"t":"Odojče udvostruci ™ sa rođenja krajem 5-og meseca, utrostruci krajem prve godine, ucetvorostruci krajem druge godine. Krajem prve godine odojče je dugacko oko 73-75 cm. Krajem 5 godine dete udvostruci TD sa rođenja, a utrostruci u pubertetu.","p":16},{"t":"U trećem mesecu se potrbuške odiže na podlaktice. u četvrtom mesecu sve predmete stavlja u usta. U petom mesecu se obrce sa stomaka na leđa i obrnuto. Sesti mesec je prekretnica- sedi uz potporu, pruža obe ruke kako bi uzelo predmet. Sedmi mesec idealan za igru. U devetom mesecu premešta predmete iz ruke u ruku, počinje da razvija pincet hvat, puzi na sve četiri, sedi stabilno, počinje da se podiže uz ogradicu ili oslonac i da stoji. Deseti mesec- pokušava da napravi korake uz ogradicu, pincet hvat razvijen. 11 mesec- hoda uz pridržavanje, samostalno drži keks u ruci i gricka ga, reci izgovara-ajde, pa pa. u dvanaestom mesecu sve češće traži da hoda, koristi sve više reci u slogovima, počinje samostalno da jede...","p":16},{"t":"Centar za disanje se nalazi u produženoj moždini.","p":17},{"t":"Za svaki stepen iznad normalne temp. disanje se ubrzava za 4 respiracije, a puls za 8-12 otkucaja.","p":17},{"t":"Oksigenoterapija je primena kiseonika inhalacionim putem u terapijske svrhe. Može se dati preko maske za usta i nos, binazalne kanile, nazofaingealnog katetera, inkubatora i endotreahealnog tubusa.","p":17},{"t":"Centar za mokrenje je smešten između 3-4 lumbalnog prsljena-kicmena mozdina. Biohemijski pregled urina podrazumeva proteine-proteinurija, šećere- glikozurija, ketonska tela-ketonurija, bilirubin, urobilinogen. Urinokultura je zasejavanje urina na hranljive podloge radi izolacije uzročnika infekcije urinarnog trakta. Uvek se radi i antibiogram odnosno osetljivost bakterije koja je izolovana na određene antibiotike. Infekcija postoji ako ima više od 100 000 bakterija u 1 ml urina.","p":17},{"t":"Centar za defekaciju se nalazi u lumbosakralnom delu kičmene moždine. Koprokultura- bakteriološki pregled stolice. Kod sumnje na krvarenje u digestivnom traktu se radi test na okultno krvarenje-Adler Veber.","p":17},{"t":"Morbili/male boginje je infekcija respiratornog sistema izazvana virusom morbila. Koplikove mrlje su karateristicne za ovu infekciju. Prevencija nastanka MMR vakcina. Varičele/ovčije boginje/vodene boginje- Izaziva je virus herpesa. Imunitet nakon prelezanih boginja je trajan što znaci da više ne može da se oboli od njih. Ospa prolazi kroz nekoliko stadijuma(makula, papula, vezikula i krusta). Ospa je polimorfna što znaci da u isto vreme na koži deteta se mogu videti različiti stadijumi ospe","p":17},{"t":"Omfalokela predstavlja ispadanje trbušnih organa kroz defekt u sredisnjij liniji.","p":17},{"t":"Gatrijev test je jedan od testova u sklopu neonatalnog skrininga novorođenčadi. Podrazumeva ispitivanje dve bolesti- fenilketonurija i kongenitalna hipotireoza. Fenilketonurija je nasledna metabolička bolest kod koje se aminokiselina fenilalanin ne razgradjuje u organizmu nego se nagomilava izazivajući oštećenja CNS-a, Urođena hipotireoza je urođena smanjena funkcija štitne žlezde, ona u smanjenoj količini ili uopšte ne proizvodi hormone tiroksin i trijodtironin. Izgled nn: ostra gusta kosa, široko lice grubih crta,veliki jezik koji viri iz usta. Ako se ne leci dovodi do mentalnog propadanja.","p":17},{"t":"Prva stolica koju dete ima se zove mekonijum, tamno zelena, sluzava i predstavlja mesavinu amnionske tečnosti, žuči i sekreta iz crevnih žlezda.","p":17},{"t":"Novorođenče koje majka doji ima oko 5 mokrih pelena dnevno, dok bebe na dohrani imaju 10ak.","p":17},{"t":"Prednosti dojenja: majčino mleko je prilagodjeno potrebama deteta i menja se u skladu sa tim kako dete raste; lakše se vari u odnosu na kravlje mleko; deluje blagotvorno na stomak deteta; sprečava alergije i infekcije, jača vilicu.","p":17},{"t":"Posle prvog rodjendana detetu uvoditi kravlje mleko u ishranu. Prvo se daje punomasno mleko jer im je neophodan visok sadržaj esencijalnih masnih kiselina koje su važne za njihov rast i razvoj mozga.","p":17},{"t":"Skrining test prvog tromesecja koji se najčešće radi u trudnoći je Dabl test.To je kombinovani test, sastoji iz ultrazvucnog pregleda i uzimanja krvi. Sluzi za utvrđivanje postojanja hromozomskih aberacija- Daunov sindrom. Najčešće se radi između 11 i 14 nedelje trudnoće. Biopsija horionskih cupica-analiza koja se radi između 11 i 12 nedelje trudnoće i koja pokazuje da li dete ima neki genetski ili hromozomski poremećaj. Amniocenteza je pregled plodove vode=radi se u drugom tromesecju","p":17},{"t":"Kordocenteza je invazivna metoda prenatalnog testiranja u kojoj se uzima uzorak krvi bebe iz pupčanika. Između 18 i 24 nedelje. Sluzi za otkrivanje hromozomskih aberacija, bolesti krvi kao što je fetalna anemija i ako je majka bila zarazena npr. rubeolom, da li je i dete zarazeno.","p":17},{"t":"Fiziološka žutica/ikterus je stanje koje izaziva zutu prebojenost kože i beonjaca. Javlja se najčešće između 2 i 7 dan od rođenja. Nastaje kada nezrela jetra nn ne može da obradi dovoljno brzo eritrocite kojih ima mnogo i bilirubin počinje da se povećava u krvi. Lekar može prepisati fototerapiju.","p":17},{"t":"Ako novorođenče ima manje od 2500 grama smatra se da ima malu telesnu masu bez obzira da li je dete rođeno pre termina ili u terminu. Uzroci: genetika, prevremeno rodjenje, blizanacka trudnoća, ako je postojao neki problem sa posteljicom u trudnoći, stres u trudnoći","p":18},{"t":"Apgar skor je pregled nn u prvom i petom minutu posle porođaja. Ocenjuje se disanje, puls, refleksi, tonus mišića i boja kože. Ocena za svaki parametar je od 0-2","p":18},{"t":"Ultrazvučni pregled kukova je jedna od metoda ranog otkrivanja razvojnog poremećaja kuka. Primarni pregled u porodilištu, a najkasnije do mesec dana po rođenju, a sekundarno snimanje je u drugom mesecu.","p":18},{"t":"Tortikolis je jedan od najčešćih deformiteta kod nn, krivi vrat. Dešava se kada je mišić sa jedne strane vrata skraćen, pa beba naginje glavu na tu stranu i okreće lice u suprotnu. Ukoliko se primeti na vreme uz fizikalnu terapiju stanje se popravlja.","p":18},{"t":"Patronažna sestra će majku savetovati da se obavezno javi pedijatru u savetovalište ako odojče sa šest meseci još nije svoju težinu: udvostrucilo u odnosu na porodjajnu.","p":18},{"t":"Natalitet je broj živorođene dece u odnosu na broj stanovnika.","p":18},{"t":"Voda kod odojčeta čini i do 75% ukupne telesne mase pa su posledice gubitka tečnosti kod dece teške. Gubitak tečnosti u visokom stepenu preko 6% telesne mase se može prepoznati po: žeđ, suve usne, obložen jezik, suva koža bez turgora, upale oči, uvucena fontanela kod beba, puls se ubrzava, pada pritisak.","p":18},{"t":"Kefalhematom- krvni podliv na glavi nn koji nastaje tokom porođaja. Obično se vezuje za upotrebu forcepsa ili vakum-ekstraktora. Th uglavnom nije potrebna. Porođajni naduv je izrazit otok mekih tkiva koji se javlja na predjacecem delu glave pri rađanju. Th nije potrebna.","p":18},{"t":"Spina Bifida- malformacija u predelu kičme. Moždane opne zajedno sa oštećenim delom kičmene moždine se nalaze van kičmenog kanala. Spada u defekt neuralne cevi.","p":18},{"t":"Omfalitis je infekcija pupka.","p":18},{"t":"Kod nn i odojčadi se ne preporučuje Hajmlihov zahvat radi oslobađanja disajnih puteva. nn postupak- uhvatiti dete za noge, podignuti uvis i lupkati po leđima između lopatica. odojče postupak- potrbuške na podlakticu tako da glava leži na dlanu i usmerena ka dole. lupkati 5x između lopatica. Ako strano telo ne ispadne okrenuti ga na leđa i pritisnuti sa dva prsta na sredinu grudne kosti.","p":18}],"notes":{"numbers":[{"k":"KPR – odnos kompresija i udisaja","v":"30 : 2","s":"Februarski rok, str. 1"},{"k":"Frekvencija kompresija sternuma (odrasli)","v":"do 120/min","s":"KMST zbirka, str. 17 · Skripta 1678…, str. 5","o":["Do 120/min","8-12 respiracija/min","60–80 u minuti"]},{"k":"Ulegnuće grudnog koša pri kompresiji (odrasli)","v":"4–5 cm","s":"Pitanja stručni ispit, str. 6 (u skripti 1678, str. 5: 5–6 cm)","o":["4–5 cm","2-3 cm","10 cm"]},{"k":"Provera disanja i pulsa kod osobe bez svesti","v":"do 10 s","s":"KMST zbirka, str. 3 · Skripta 1678…, str. 12","o":["Do 10 s","30 s","60 sekundi kontinuirano"]},{"k":"Respiracije – odrasli","v":"18–20/min","s":"ZDR nega (bitno), str. 1 · Nova pitanja 1. dec, str. 1","o":["18–20/min","60–80/min","8-12 respiracija/min"]},{"k":"Respiracije – deca","v":"20–22/min","s":"ZDR nega (bitno), str. 4 · Nova pitanja 1. dec, str. 3","o":["20–22/min","60–80/min","8-12 respiracija/min"]},{"k":"Puls – odrasli","v":"60–80/min","s":"Nega 2 (udžbenik), str. 8 · Skripta 1678…, str. 2","o":["60–80/min","18–20/min","8-12 respiracija/min"]},{"k":"Puls – novorođenče / odojče / malo dete","v":"120–140 / 110–120 / 100–110","s":"Skripta 1678…, str. 2"},{"k":"Krvni pritisak – sistolni / dijastolni","v":"120–140 / 60–80 mmHg","s":"Skripta 1678…, str. 5"},{"k":"pH krvi","v":"7,35–7,45","s":"Skripta 1678…, str. 9"},{"k":"Metabolička acidoza","v":"pH ispod 7,35","s":"ZDR nega (bitno), str. 4 · Nova pitanja 1. dec, str. 4"},{"k":"Gustina urina","v":"1012–1025","s":"ZDR nega (bitno), str. 3 · Nova pitanja 1. dec, str. 3"}, nika","s":"USTAV, str. 2"},{"k":"Mandat predsednika Republike / Vlade","v":"5 godina / 4 godine","s":"USTAV, str. 1 i 3","o":["5 godina / 4 godine","Navršenih 15 godina","Ukupno 2 godine"]}],"topics":[{"title":"Sterilizacija, dezinfekcija, asepsa","src":"Sterilizacija; Nova pitanja 1. dec; Nova pitanja 4. dec; KMST zbirka; Skripta 1678…","sections":[{"h":"Pojmovi","items":["Sterilizacija je potpuno uništavanje mikroorganizama i njihovih spora sa predmeta, materijala i instrumenata koji dolaze u kontakt sa pacijentom ili ranom. To je metoda asepse.","Asepsa se postiže sterilizacijom, antisepsa dezinfekcijom.","Dezinfekcija je delimično uništavanje mikroorganizama sa kože, predmeta i materijala.","Dezinfekcija po toku: početna, dezinfekcija u toku, završna."]},{"h":"Metode sterilizacije","items":["Toplotna: suva toplota (suvi sterilizator) i vlažna toplota (autoklav).","Hemijska: gasovima (etilen-oksid, formaldehid) ili potapanjem.","Posebne: jonizujuće zračenje, UV zraci, ultrazvuk, plazma, filtriranje.","Najbolja METODA sterilizacije je fizička; najpouzdanija KONTROLA sterilizacije je biološka."]},{"h":"Aparati i vrednosti","items":["Suvi sterilizator: 160 °C – 2 h ili 180 °C – 1 h; vreme se računa od postizanja temperature. Steriliše metal, staklo, porcelan, keramiku.","Autoklav (vodena para pod pritiskom): metalni instrumenti, gumeni predmeti, tekstil i stakleni predmeti. Tekstil: 134 °C, 2,5 bara.","Etilen-oksid: „hladna” sterilizacija termolabilnog materijala (optika, implantati); na ispitu 55 °C.","Plazma (vodonik-peroksid): sočiva i kamere endoskopa; 45–55 min, 47–56 °C.","UV lampe sterilišu vazduh u sali (12–18 h).","Materijal u zatvorenom dobošu ili kaseti je sterilan 72 h, a posle otvaranja 24 h."]},{"h":"Kontrola sterilizacije","items":["Fizička (termometri, manometri), hemijska (indikator trake) i biološka (bakteriološka) – najpouzdanija.","Mukolicev papir služi za kontrolu uspešnosti sterilizacije."]},{"h":"Dezinficijensi","items":["Vrste: alkoholni, hlorni i jodni preparati, jedinjenja amonijaka, fenoli.","Alkoholom se dezinfikuje neoštećena koža; hidrogenom (3% H₂O₂) se čiste rane, ali ne duboke.","Dezinfekcija ruku traje najmanje 30 s."]}],"ids":["6261b01","a5896f9","f1c74f4","62f3cea","f2586c8","e344e48","9dfe3ab","d46f798","de57a73","32502e0","a378c3e","4433c96","dce171c","6970df5","588df57","e2a53cc","ecbe887","01f96f3","b9eed2b","bbe8146","ac4f62c","884a281","7518a00","1df22f0","78cc222","74c883c","1843604","b7611f8","d394d38","c926108","07f6ec9","3ebe9a7","db21115","9453297","5adbab2","b46d47d","44f55df","224dfed","020f9a0","e683b22","fafbe24","0c60856","60b3e3f","f7d16ae","3fe6c14","4d4486d","1a46a4e","1d16c3e","f0f3f6d","a61b994","39424f2","ac333d1","aab4b67","24ba8fe","ca86a3a","fc2b7b1","38820f1","63138a7","c53d259","5241126","f6e8830","e167550","579bcbf","ee56be0","2b3d154","3440f14","92c8634","3c9e464","9c23b5d","266b54b"]},{"title":"Krvarenje i hemostaza","src":"KMST zbirka; Skripta 1678…; ZDR nega (bitno); Nova pitanja 4. dec; Pitanja stručni ispit","sections":[{"h":"Podela krvarenja","items":["Po mestu: spoljašnje i unutrašnje. Izlivanje krvi iz unutrašnjih organa preko prirodnih puteva spada u spoljašnje krvarenje.","Po vremenu nastanka: primarno i sekundarno (sekundarno nastaje posle određenog vremena od povrede).","Po vrsti krvnog suda: arterijsko, vensko, kapilarno (mešovito).","Arterijsko: brzo i obilno, u mlazevima, svetlocrvena krv."]},{"h":"Hemostaza","items":["Privremena: digitalna kompresija, hiperfleksija ekstremiteta (prinudna fiksacija), tamponada rane, Esmarhova poveska.","Definitivna (trajna): podvezivanje (ligatura), šav (sutura) krvnog suda, metalna štipaljka (klips), termo- i elektrokoagulacija.","Tamponada rane spada i u privremenu i u definitivnu hemostazu.","Arterijsko krvarenje se digitalnom kompresijom zaustavlja IZNAD mesta krvarenja.","Kod svakog krvarenja prvo se radi digitalna kompresija.","Iskrvavljenog stavljamo u položaj autotransfuzije: na leđa sa blago podignutim nogama."]}],"ids":["9ab125c","41b31e7","fcb9292","c66d573","961301f","b6d365a","3a68b86","a401550","80fb237","c57336a","02c204c","09a2636","c5834da","7fc6a28","9c458bf","bc1a8aa","3636ff5","33653f9","7a68efe","6d9c447","9119ac2","07afe03","63a088a","4aea469","3213bd9","8c9922e","62eef10","9e57d16","b0a8e89","e843ff6","43eba0b","d2d686c","9158a77","495b197","36288ea","305dc66","7e44042","39c44fd","977491c","e2d2390","d0a7460","d20a6bf","782a9ed","d8ef13e","414bdde","49b0f13","c2bc741","d36f915","c3f2c89","550d561","25726fe","76e573d","25bfe35"]},{"title":"Reanimacija i prva pomoć","src":"Februarski rok; KMST zbirka; Skripta 1678…; Pitanja stručni ispit","sections":[{"h":"KPR","items":["Sigurni znaci srčanog zastoja: nagli gubitak svesti, odsustvo disanja i pulsa na karotidama.","Provera disanja i pulsa traje do 10 sekundi; disanje se proverava metodom „gledaj–slušaj–oseti”.","Odnos kompresija i udisaja 30:2; frekvencija do 120 u minuti.","Kompresija na sredini donje polovine grudne kosti; na testu je ulegnuće 4–5 cm.","Unesrećeni leži na leđima, na tvrdoj ravnoj podlozi, sa blago podignutim nogama.","Prvi lek u reanimaciji je adrenalin.","Reanimacija se ne započinje kod bolesnika u terminalnom stadijumu neizlečive bolesti."]},{"h":"Prva pomoć","items":["Hajmlihov zahvat: pesnica između pupka i donjeg okrajka grudne kosti.","Osnovno pravilo imobilizacije je pravilo „dvojke”; povreda vratne kičme – Šancova kragna.","Strana tela i fragmenti kostiju se na terenu nikako ne vade.","„Zlatni sat” je vreme od povređivanja do definitivnog hirurškog zbrinjavanja.","Opekotine: pravilo devetke (glava, vrat i lice 9%); rashlađivanje vodom, nikako ledom."]}],"ids":["961301f","6cc63dd","80fb237","c57336a","d87c327","97bec48","92382e6","78fdb03","6d9c447","197d11a","fceb17d","f39af5f","5073414","f0ac0c6","68c160a","a8f96cb","dac358a","a41c64b","413d314","01759f6","66352ec","bc2416e","b0a8e89","e843ff6","43eba0b","e751356","0849ab0","bca00f0","0d0f826","978f2ea","14c16ad","03432c0","b559 let saveT=null;
function save(remote){S.upd=Date.now();clearTimeout(saveT);saveT=setTimeout(writeLocal,120); if(remote!==false)scheduleSync()}
function dkey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){return dkey(new Date())}
function stat(id){return S.st[id]||(S.st[id]={n:0,k:0,l:-1,b:0,d:0,t:0})}
const INTERVALS=[0, 10*60e3, 60*60e3, 5*3600e3, 20*3600e3, 48*3600e3];
function record(id, ok){
  const s=stat(id); s.n++; if(ok){s.k++; s.b=Math.min(5,s.b+1);} else {s.b=0;}
  s.l=ok?1:0; s.d=Date.now()+(ok?INTERVALS[s.b]:3*60e3); s.t=Date.now();
  const d=today(); S.days[d]=(S.days[d]||0)+1; if(ok)S.ok[d]=(S.ok[d]||0)+1; save();
}
function known(i){const s=S.st[i.id];return !!(s&&s.l===1&&s.k>=1)}
function wrongLast(i){const s=S.st[i.id];return !!(s&&s.l===0)}
function seen(i){const s=S.st[i.id];return !!(s&&s.n)}
function isBm(id){return (S.bm[id]||0)>0}
function toggleBm(id){S.bm[id]=isBm(id)?-Date.now():Date.now();save();toast(isBm(id)?"Sačuvano u „Sačuvana pitanja”":"Uklonjeno iz sačuvanih")}
function bmIds(){return Object.keys(S.bm).filter(id=>S.bm[id]>0&&BYID[id])}

/* ============ oblak (baza aplikacije) ============ */
let DB=null, REF=null, syncState="local", writing=Promise.resolve(), pushed=0, syncT=null, cloudRO=false, resolveDb;
const dbReady=new Promise(r=>resolveDb=r);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function mergeState(a,b){
  const o=normState(JSON.parse(JSON.stringify(a))); b=normState(b);
  Object.keys(b.st).forEach(id=>{const x=o.st[id],y=b.st[id]; if(!y)return; if(!x||(y.t||0)>(x.t||0)||((y.t||0)===(x.t||0)&&y.n>x.n))o.st[id]=y});
  ["days","ok"].forEach(k=>Object.keys(b[k]).forEach(d=>{o[k][d]=Math.max(o[k][d]||0,b[k][d]||0)}));
  const seenT=new Set(o.hist.map(x=>x.t)); b.hist.forEach(x=>{if(!seenT.has(x.t))o.hist.push(x)}); o.hist.sort((x,y)=>x.t-y.t); o.hist=o.hist.slice(-120);
  Object.keys(b.bm).forEach(id=>{if(Math.abs(b.bm[id])>Math.abs(o.bm[id]||0))o.bm[id]=b.bm[id]});
  Object.assign(o.rep,b.rep);
  if((b.settings.t||0)>(o.settings.t||0))o.settings=b.settings;
  o.qdone=Math.max(a.qdone||0,b.qdone||0);
  const qa=a.quiz,qb=b.quiz; let q=(qa&&qb)?((qb.t||0)>(qa.t||0)?qb:qa):(qa||qb); if(q&&(q.t||0)<=o.qdone)q=null; o.quiz=q;
  o.lastOpen=Math.max(a.lastOpen||0,b.lastOpen||0); o.upd=Math.max(a.upd||0,b.upd||0);
  return o;
}
function scheduleSync(){ if(!REF||cloudRO)return; clearTimeout(syncT); syncT=setTimeout(pushRemote,2500) }
function pushRemote(){
  if(!REF||cloudRO||!DB||S.upd<=pushed)return writing;
  const ref=REF, iref=DB.doc("profiles/"+PROF.active), slug=PROF.active, at=S.upd;
  const body=JSON.parse(JSON.stringify(S)); if(JSON.stringify(body).length>240000)body.hist=body.hist.slice(-30);
  const t=totals(S), idx={name:S.settings.name,n:t.n,k:t.k,u:at};
  writing=writing.then(()=>ref.set(body)).then(()=>iref.set(idx)).then(()=>{ if(slug===PROF.active){pushed=Math.max(pushed,at);setSync("ok")} })
    .catch(e=>{ const c=e&&e.code; if(c==="invalid_argument"){cloudRO=true;setSync("ro")} else if(c==="revoked"||c==="not_granted"||c==="capability_disabled"||c==="capability_removed"){DB=null;REF=null;setSync("local")} else setSync("err") });
  return writing;
}
function setSync(s){syncState=s;const d=document.querySelector("#btnSettings .syncdot"); if(d)d.className="syncdot"+(s==="ok"?" ok":s==="err"?" err":"")}
function syncText(){
  const nm=S.settings.name?`„${esc(S.settings.name)}”`:"ovo ime";
  return syncState==="ok"?`Napredak za ${nm} čuva se na ovom telefonu i u bazi aplikacije. Na drugom uređaju samo upiši isto ime.`
    :syncState==="ro"?"Napredak se čuva na ovom telefonu, posebno za svako ime. (Sa ovim linkom baza aplikacije može samo da se čita.)"
    :syncState==="err"?"Baza aplikacije se trenutno ne javlja. Napredak je sačuvan na ovom telefonu i biće poslat kad veza proradi."
    :"Napredak se čuva na ovom telefonu, posebno za svako ime.";
}
function stateSig(){return JSON.stringify([Object.keys(S.st).length,S.hist.length,Object.keys(S.bm).length,S.settings,S.quiz&&S.quiz.t])}
async function pullRemote(){
  if(!DB||!PROF.active)return;
  const slug=PROF.active;
  try{
    const snap=await DB.doc("progress/"+slug).get();
    if(slug!==PROF.active||!DB)return;
    const had=hasProgress(S);
    if(snap.exists){ const before=stateSig(); S=mergeState(S,snap.data()); S.settings.name=PROF.list[slug].name; writeLocal(); applyTheme(); updateAvatar();
      if(stateSig()!==before){ if(!had&&hasProgress(S))toast("Učitan je sačuvan napredak"); if(!["quiz","deck"].includes(current)&&!document.querySelector(".scrim"))go(current,{keep:true}) } }
    REF=DB.doc("progress/"+slug);
    if(cloudRO)setSync("ro"); else {setSync("ok"); S.upd=Date.now(); pushRemote()}
  }catch(e){ setSync("err") }
}
async function cloudProfiles(){
  await Promise.race([dbReady,wait(4000)]); if(!DB)return [];
  try{const q=await DB.collection("profiles").limit(200).get();
    return q.docs.map(d=>{const x=d.data()||{}; return {slug:d.id,name:cleanName(x.name),n:+x.n||0,k:+x.k||0,u:+x.u||0}}).filter(p=>p.name&&slugOf(p.name)===p.slug)}catch(e){return []}
}
async function migrateAccount(user,db){
  // Verzija 2 je čuvala napredak uz Claude nalog; prebacuje se jednom u profil sa tim imenom.
  if(PROF.acct||!user)return;
  const id=await user.id(); if(!id)return;
  const snap=await db.doc("data/users/"+id+"/progress").get();
  if(!snap.exists){PROF.acct=1;saveProfiles();return}
  const o=normState(snap.data()); const nm=cleanName(o.settings.name)||(PROF.active?PROF.list[PROF.active].name:""); const slug=slugOf(nm); if(!slug)return;
  if(slug===PROF.active){ S=mergeState(S,o); S.settings.name=PROF.list[slug].name; writeLocal() }
  else { const m=mergeState(readLocal(slug)||freshState(nm),o); const nm2=(PROF.list[slug]&&PROF.list[slug].name)||nm; m.settings.name=nm2; lsSet(skey(slug),JSON.stringify(m)); PROF.list[slug]=Object.assign(PROF.list[slug]||{name:nm2,c:Date.now()},{u:m.upd||Date.now()}) }
  PROF.acct=1; saveProfiles();
}
async function initSync(){
  try{
    if(!window.claude||typeof window.claude.use!=="function")return;
    const [user,db]=await Promise.all([window.claude.use("user"),window.claude.use("db")]);
    if(!db)return;
    DB=db;
    try{ await migrateAccount(user,db) }catch(e){}
    if(PROF.active) await pullRemote();
  }catch(e){ setSync("err") }
  finally{ resolveDb() }
}

function avatarHTML(name,lg){const nm=cleanName(name); const ch=nm?[...nm][0].toUpperCase():"?"; return `<span class="avatar notr${lg?" lg":""}" style="--h:${hueOf(slugOf(nm))}" aria-hidden="true">${esc(ch)}</span>`}
function updateAvatar(){const b=document.getElementById("btnProfile"); if(!b)return; b.innerHTML=avatarHTML(S.settings.name); b.setAttribute("aria-label",S.settings.name?"Profil: "+S.settings.name:"Profil")}
function openProfile(name){
  name=cleanName(name); const slug=slugOf(name); if(!slug)return null;
  if(PROF.active===slug)return Promise.resolve();
  if(PROF.active)flush();
  clearTimeout(syncT); if(timerInt){clearInterval(timerInt);timerInt=null}
  quiz=null; fcs=null; lastResult=null;
  const carry=!PROF.active&&hasProgress(S)?S:null;
  const nm=(PROF.list[slug]&&PROF.list[slug].name)||name;
  let next=readLocal(slug)||freshState(nm);
  if(carry)next=mergeState(next,carry);
  next.settings.name=nm; S=next;
  PROF.list[slug]=Object.assign(PROF.list[slug]||{name:nm,c:Date.now()},{u:Date.now()}); PROF.active=slug; saveProfiles();
  S.lastOpen=Date.now(); writeLocal();
  REF=null; pushed=0; if(syncState==="ok")setSync("local");
  applyTheme(); updateAvatar(); refreshAll();
  if(carry)save();
  return Promise.race([dbReady,wait(4000)]).then(()=>PROF.active===slug?pullRemote():null);
}
function deleteProfile(slug){
  lsDel(skey(slug)); delete PROF.list[slug];
  if(DB&&!cloudRO){ DB.doc("progress/"+slug).delete().catch(()=>{}); DB.doc("profiles/"+slug).delete().catch(()=>{}) }
  if(PROF.active===slug){ PROF.active=""; REF=null; clearTimeout(syncT); quiz=null; fcs=null; lastResult=null; S=defState(); S.settings.onboarded=true; saveProfiles(); updateAvatar(); go("home"); whoSheet(true); return }
  saveProfiles();
}
function ago(t){ if(!t)return ""; const d=Date.now()-t; if(d<60*60e3)return "upravo"; const a=new Date(t),b=new Date(); const days=Math.round((new Date(b.getFullYear(),b.getMonth(),b.getDate())-new Date(a.getFullYear(),a.getMonth(),a.getDate()))/864e5); return days<=0?"danas":days===1?"juče":`pre ${days} dana` }

/* ============ pismo ============ */
const L2C = {"lj":"љ","nj":"њ","dž":"џ","Lj":"Љ","LJ":"Љ","Nj":"Њ","NJ":"Њ","Dž":"Џ","DŽ":"Џ",
 a:"а",b:"б",v:"в",g:"г",d:"д",đ:"ђ",e:"е",ž:"ж",z:"з",i:"и",j:"ј",k:"к",l:"л",m:"м",n:"н",o:"о",p:"п",r:"р",s:"с",t:"т",ć:"ћ",u:"у",f:"ф",h:"х",c:"ц",č:"ч",š:"ш",
 A:"А",B:"Б",V:"В",G:"Г",D:"Д",Đ:"Ђ",E:"Е",Ž:"Ж",Z:"З",I:"И",J:"Ј",K:"К",L:"Л",M:"М",N:"Н",O:"О",P:"П",R:"Р",S:"С",T:"Т",Ć:"Ћ",U:"У",F:"Ф",H:"Х",C:"Ц",Č:"Ч",Š:"Ш"};
const KEEP_RX = /^(?:[A-Z]{2,6}|[a-z]*[A-Z][a-zA-Z]*[A-Z][a-zA-Z]*|pH|Rh|mmHg|x)$/;
function wordToCyr(w){
  if(KEEP_RX.test(w)) return w;
  let out="",i=0; const lw=w.toLowerCase();
  const noDig=/^(injek|konjunk|konjug|vanjez|nadživ|podžel|nadžn|odživ)/.test(lw);
  while(i<w.length){const two=w.substr(i,2); if(!noDig&&L2C[two]!==undefined){out+=L2C[two];i+=2;continue} const ch=w[i]; out+=(L2C[ch]!==undefined?L2C[ch]:ch); i++}
  return out;
}
function toCyr(s){return s.replace(/[A-Za-zČĆŠŽĐčćšžđ]+/g,m=>wordToCyr(m))}
function applyScript(root){
  if(S.settings.script!=="cyr"||!root) return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&n.parentElement.closest(".notr,script,style,textarea")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{n.nodeValue=toCyr(n.nodeValue)});
  root.querySelectorAll("[placeholder],[aria-label]").forEach(el=>{["placeholder","aria-label"].forEach(a=>{if(el.hasAttribute(a))el.setAttribute(a,toCyr(el.getAttribute(a)))})});
}

/* ============ helpers ============ */
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function h(html){const t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstElementChild}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"dj")}
function toast(msg){document.querySelectorAll(".toast").forEach(t=>t.remove());const t=h(`<div class="toast" role="status">${esc(msg)}</div>`);applyScript(t);document.body.appendChild(t);setTimeout(()=>t.remove(),2000)}
function pctClass(p){return p>=75?"good":p>=50?"mid":"low"}
function srcHTML(it){
  if(it.srcText) return `<div class="src">${esc(it.srcText)}</div>`;
  return `<div class="src">${it.s.map(s=>`<span><b>${esc(DOCS[s[0]])}</b>${s[1]?`, str. ${s[1]}`:""}</span>`).join(" · ")}</div>`;

function badgesHTML(it,withArea){
  const b=[];
  if(it.num) b.push(`<span class="badge area">${I.hash}Broj</span>`);
  else if(withArea) b.push(`<span class="badge area">${AREA_SHORT[it.a]}</span>`);

}
function sameText(a,arr){const x=norm(a).replace(/[^a-z0-9]/g,"");return arr.some(r=>{const y=norm(r).replace(/[^a-z0-9]/g,"");return x===y||(x.includes(y)&&x.length-y.length<8)||(y.includes(x)&&x.length>=3)})}
function answerHTML(it){
  if(it.t==="mc") return `<div class="answer"><b>${it.c.map(k=>esc(it.o[k])).join("<br>")}</b>${it.ans&&!sameText(it.ans,it.c.map(k=>it.o[k]))?`<div class="muted" style="margin-top:6px">${esc(it.ans)}</div>`:""}</div>`;
  if(it.list) return `<div class="answer"><ul>${it.list.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
  return `<div class="answer">${esc(it.ans||"")}</div>`;
}
function mcExplain(it,ok){
  const right=it.c.map(k=>it.o[k]); let html="";
  if(!ok) html+=`<div><span class="muted">Tačan odgovor:</span> <b>${right.map(esc).join("; ")}</b></div>`;
  if(it.ans&&!sameText(it.ans,right)) html+=`<div>${esc(it.ans)}</div>`;

function noteHTML(it){return it.n?`<div class="note">${esc(it.n)}</div>`:""}
function daysLeft(){const n=new Date();const a=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.round((EXAM_DATE-a)/864e5)}
function poolStats(pool){let k=0,sn=0; pool.forEach(i=>{const s=S.st[i.id]; if(s&&s.n){sn++; if(s.l===1)k++;}}); return {total:pool.length,known:k,seen:sn}}
function areaStats(a){return poolStats(TESTABLE.filter(i=>i.a===a))}
function topicStats(t){return poolStats(quizzable(t.ids))}
function streak(){let n=0;const d=new Date(); if(!S.days[dkey(d)])d.setDate(d.getDate()-1); for(;;){if(S.days[dkey(d)]){n++;d.setDate(d.getDate()-1)}else break}return n}
function testsToday(){const d=today();return S.hist.filter(x=>dkey(new Date(x.t))===d).length}
function dueItems(){const now=Date.now();return TESTABLE.concat(NUMIDS.map(id=>BYID[id])).filter(i=>{const s=S.st[i.id];return s&&s.n&&s.d<=now&&s.b<5})}
function quizzable(ids){return ids.map(id=>BYID[id]).filter(i=>i&&i.t==="mc"&&!i.fact)}

function fmtDate(t){const d=new Date(t);return `${d.getDate()}.${d.getMonth()+1}. ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`}

/* ============ selection ============ */
function weight(i){
  const s=S.st[i.id]; let w=1;
  if(i.x) w*=2.2; if(i.f>=2) w*=1+0.5*Math.min(i.f,4);
  if(i.t==="mc") w*=1.3;
  if(!s||!s.n) w*=1.4; else if(s.l===0) w*=3; else if(s.b>=3) w*=0.25; else if(s.b>=2) w*=0.5;
  if(i.u) w*=0.7;
  return w;
}
function pick(pool,n){
  const res=[],groups=new Set(); const cand=pool.slice();
  while(res.length<n&&cand.length){
    let tot=0; const ws=cand.map(i=>{const w=weight(i);tot+=w;return w});
    let r=Math.random()*tot,idx=0; for(;idx<cand.length;idx++){r-=ws[idx];if(r<=0)break}
    const it=cand.splice(Math.min(idx,cand.length-1),1)[0];
    if(it.g!=null&&groups.has(it.g))continue; if(it.g!=null)groups.add(it.g); res.push(it);
  }
  return res;
}
function mixByArea(n,pool){
  const share={nega:.6,zastita:.25,ustav:.15}; let out=[];
  Object.keys(share).forEach(a=>{out=out.concat(pick(pool.filter(i=>i.a===a),Math.round(n*share[a])))});
  if(out.length<n) out=out.concat(pick(pool.filter(i=>!out.includes(i)),n-out.length));
  return shuffle(out.slice(0,n));
}

  s.querySelectorAll("#bS button").forEach(b=>b.onclick=()=>{cfg.src=b.dataset.v;paint()});

function startQuiz(o){
  const pool=TESTABLE;
  let items=[], title="Brzi test", timed=0;
  if(o.mode==="brzi"){items=mixByArea(15,pool)}
  else if(o.mode==="oblast"){items=pick(pool.filter(i=>i.a===o.area),15);title=AREAS[o.area]}
  else if(o.mode==="rok"){items=pick(pool.filter(i=>i.x),15);title="Sa pravih rokova"}
  else if(o.mode==="cesto"){items=pick(pool.filter(i=>i.f>=2),15);title="Najčešća pitanja"}
  else if(o.mode==="greske"){items=shuffle(TESTABLE.filter(wrongLast)).slice(0,15);title="Moje greške"}
  else if(o.mode==="bm"){items=shuffle(quizzable(bmIds()).filter(i=>!i.num)).slice(0,15);title="Sačuvana pitanja"}
  else if(o.mode==="sim"){items=shuffle([].concat(pick(pool.filter(i=>i.a==="nega"),20),pick(pool.filter(i=>i.a==="zastita"),6),pick(pool.filter(i=>i.a==="ustav"),4)));title="Simulacija ispita";timed=45*60}
  else if(o.mode==="ids"){items=quizzable(o.ids);title=o.title||"Test"}
  if(!items.length){toast(o.mode==="bm"?"Još nemaš sačuvanih pitanja":o.mode==="greske"?"Nema grešaka – samo napred!":"Nema pitanja za ovaj izbor");return}
  beginQuiz({mode:o.mode,area:o.area,title,items,timed});
}
function beginQuiz(o){
  quiz={mode:o.mode,area:o.area,title:o.title,items:o.items,idx:0,answers:[],start:Date.now(),timed:o.timed||0,sim:o.mode==="sim",sel:[],reveal:false};
  quiz.orders=quiz.items.map(it=>it.t==="mc"?optOrder(it):null);
  persistQuiz(); go("quiz");
}
function persistQuiz(){ if(!quiz){S.quiz=null;S.qdone=Date.now();save();return}
  S.quiz={mode:quiz.mode,area:quiz.area,title:quiz.title,items:quiz.items.map(i=>i.id),orders:quiz.orders,answers:quiz.answers.map(a=>a||null),idx:quiz.idx,start:quiz.start,timed:quiz.timed,sim:quiz.sim,t:Date.now()}; save() }
function resumeQuiz(){
  const q=S.quiz; if(!q)return; const items=q.items.map(id=>BYID[id]).filter(Boolean);
  if(!items.length||items.length!==q.items.length||items.some(i=>i.t!=="mc")){S.quiz=null;save();toast("Test ne može da se nastavi, počni novi");go("home");return}
  quiz={mode:q.mode,area:q.area,title:q.title,items,idx:Math.min(q.idx||0,items.length-1),answers:(q.answers||[]).map(a=>a||undefined),start:q.start,timed:q.timed,sim:q.sim,sel:[],reveal:false,orders:items.map((it,k)=>q.orders&&q.orders[k]&&q.orders[k].length===it.o.length?q.orders[k]:optOrder(it))};
  if(quiz.answers[quiz.idx]&&quiz.idx+1<items.length) quiz.idx++;
  if(!quiz.timed) quiz.start=Date.now()-5000;
  go("quiz");
}
function optOrder(it){
  const idx=it.o.map((_,k)=>k);
  if(it.o.some(o=>/sve navedeno|ništa od navedenog|nijedan odgovor|tačno je i pod|sve je tačno/i.test(o))||it.o.every(o=>/^(da|ne)$/i.test(o.trim()))) return idx;
  return shuffle(idx);
}

/* ============ QUIZ ============ */
function viewQuiz(v){

  const dots=quiz.items.map((x,i)=>{const a=quiz.answers[i];return `<i class="${i===quiz.idx?"cur":""} ${a?(quiz.sim?"ans":a.ok?"ok":"no"):""}"></i>`}).join("");
  const top=h(`<div class="qtop"><button class="iconbtn" id="qX" aria-label="Prekini test">${I.x}</button><div class="dots" aria-hidden="true">${n<=50?dots:""}</div><span class="qnum notr">${quiz.idx+1}/${n}</span>${quiz.timed?`<span class="timer notr" id="timer"></span>`:""}<button class="iconbtn ${isBm(it.id)?"on":""}" id="qStar" aria-label="Sačuvaj pitanje">${isBm(it.id)?I.starF:I.star}</button></div>`);

      else if(quiz.sel.includes(k))b.classList.add("sel")});
    opts.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ if(ans)return; const k=+b.dataset.k;
      if(!multi) submitMc(it,[k]); else {quiz.sel=quiz.sel.includes(k)?quiz.sel.filter(x=>x!==k):quiz.sel.concat(k);paint();if(chk)chk.disabled=!quiz.sel.length}});
    paint();
    if(ans&&!quiz.sim&&quiz.justAnswered){ quiz.justAnswered=false; opts.querySelectorAll(".opt.ok").forEach(b=>b.classList.add("pop")); if(!ans.ok) opts.querySelectorAll(".opt.no").forEach(b=>b.classList.add("shake")) }
    if(multi&&!ans){chk=h(`<button class="btn primary block" disabled>Proveri</button>`);chk.onclick=()=>submitMc(it,quiz.sel.slice());card.append(chk)}
    if(!ans) card.append(h(`<div class="muted small kbdhint">Tastatura: <span class="kbd">A</span>–<span class="kbd">D</span> ili <span class="kbd">1</span>–<span class="kbd">4</span>, zatim <span class="kbd">Enter</span></div>`));
  }

    else { const fb=h(`<div class="fb ${ans.ok?"ok":"no"}"><div class="t">${ans.ok?I.check+" Tačno":I.x+" Netačno"}</div>${it.t==="mc"?mcExplain(it,ans.ok):answerHTML(it)}${noteHTML(it)}${srcHTML(it)}<div><button class="link quiet" id="rep">${I.alert}Prijavi grešku u pitanju</button></div></div>`);

    const nx=h(`<div class="sticky-foot"><button class="btn primary block">${quiz.idx+1<n?"Sledeće pitanje":"Završi i vidi rezultat"}</button></div>`);

function tickTimer(){const el=document.getElementById("timer"); if(!quiz||!el)return; const left=Math.max(0,quiz.timed-Math.floor((Date.now()-quiz.start)/1000));
  el.textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0"); el.classList.toggle("low",left<60); if(left<=0){clearInterval(timerInt);timerInt=null;toast("Vreme je isteklo");finishQuiz()}}
function submitMc(it,sel){const ok=sel.length===it.c.length&&sel.every(k=>it.c.includes(k)); quiz.answers[quiz.idx]={sel,ok}; quiz.sel=[]; quiz.justAnswered=true; record(it.id,ok); persistQuiz(); go("quiz",{keep:true})}
function next(){ if(quiz.idx+1<quiz.items.length){quiz.idx++;quiz.reveal=false;persistQuiz();go("quiz")} else finishQuiz() }
function finishQuiz(){ if(!quiz)return; const end=Date.now();
  const n=quiz.items.length, k=quiz.answers.filter(a=>a&&a.ok).length;
  const prev=S.hist.slice().reverse().find(x=>x.mode===quiz.mode&&quiz.mode!=="ids");
  S.hist.push({t:end,mode:quiz.mode,title:quiz.title,n,k,dur:end-quiz.start}); S.hist=S.hist.slice(-120);
  quiz.end=end; lastResult={quiz,prev,celebrated:false}; quiz=null; persistQuiz(); go("results");
}

/* ============ RESULTS ============ */

    <div class="grow stack" style="gap:4px;min-width:160px"><div class="eyebrow">${esc(q.title)}</div><div style="font-size:22px;font-weight:800">${ok} od ${n} tačno</div><div class="muted">${msg}</div>
    <div class="small muted">Vreme: <span class="notr">${fmtDur(q.end-q.start)}</span>${diff!=null?` · prošli put <span class="notr">${pp}%</span> <b class="notr" style="color:${diff>=0?"var(--good)":"var(--bad)"}">${diff>=0?"+":""}${diff}%</b>`:""}</div>
    ${answered<n?`<div class="small muted">Bez odgovora: ${n-answered}</div>`:""}</div></section>`));
  if(pct>=80&&!lastResult.celebrated){lastResult.celebrated=true;setTimeout(confetti,250)}
  const wrongIds=q.items.filter((it,i)=>!(q.answers[i]&&q.answers[i].ok)).map(i=>i.id);
  const row=h(`<div class="grid2"></div>`);

  const b2=h(`<button class="btn">${I.bolt}Novi test</button>`); b2.onclick=()=>{ if(q.mode==="custom")builder(); else startQuiz({mode:q.mode==="ids"?"brzi":q.mode,area:q.area}) };
  row.append(b1,b2); v.append(row);
  const byArea={}; q.items.forEach((it,i)=>{const a=byArea[it.a]||(byArea[it.a]={n:0,k:0});a.n++;if(q.answers[i]&&q.answers[i].ok)a.k++});
  v.append(h(`<section class="flat">${Object.entries(byArea).map(([a,s])=>`<div class="kv"><span>${AREAS[a]}</span><b class="notr">${s.k} / ${s.n}</b></div>`).join("")}</section>`));
  v.append(h(`<div class="eyebrow">Pregled pitanja</div>`));

    const your=it.t==="mc"&&a&&!good&&a.sel.length?`<div class="y">${a.sel.map(k=>esc(it.o[k])).join(", ")}</div>`:"";
    const li=h(`<div class="li"><div class="row" style="align-items:flex-start"><span class="mark" style="color:${good?"var(--good)":"var(--bad)"}">${good?I.check:I.x}</span><div class="grow stack" style="gap:6px"><div class="q">${esc(it.q)}</div>${your}<div class="a">${it.t==="mc"?it.c.map(k=>esc(it.o[k])).join("; "):esc(it.list?it.list.join("; "):it.ans||"")}</div>${noteHTML(it)}${srcHTML(it)}<div class="row wrap"><button class="link quiet st">${isBm(it.id)?I.starF+"Sačuvano":I.star+"Sačuvaj"}</button><button class="link quiet rp">${I.alert}Prijavi grešku</button></div></div></div></div>`);
    li.querySelector(".st").onclick=e=>{const b=e.currentTarget;toggleBm(it.id);b.innerHTML=isBm(it.id)?I.starF+"Sačuvano":I.star+"Sačuvaj";applyScript(b)};

function surprise(){
  const items=pick(TESTABLE,3); let idx=0, ok=0;
  const s=sheet(`<div id="sp"></div>`,"Iznenadi me"); document.body.appendChild(s);

    if(idx>=items.length){box.append(h(`<div class="stack" style="align-items:center;text-align:center;padding:10px 0 4px"><div class="score notr">${ok}/3</div><div class="muted">${ok===3?"Savršeno!":"Pogrešna pitanja su dodata u „Moje greške”."}</div><div class="grid2" style="width:100%"><button class="btn" id="c1">Zatvori</button><button class="btn primary" id="c2">Još 3</button></div></div>`));
      box.querySelector("#c1").onclick=()=>{s.remove();if(current==="home")go("home",{keep:true})}; box.querySelector("#c2").onclick=()=>{s.remove();surprise()}; applyScript(box); if(ok===3)confetti(); return}
    const it=items[idx]; const order=optOrder(it);
    const c=h(`<div class="stack"><div class="eyebrow">Iznenadi me · ${idx+1}/3</div>${badgesHTML(it,true)}<div class="qtext">${esc(it.q)}</div>${it.c.length>1?`<div class="qhint">Više tačnih: ${it.c.length}</div>`:""}<div class="opts"></div></div>`);
    const opts=c.querySelector(".opts"); let sel=[];
    order.forEach((k,p)=>opts.append(h(`<button class="opt" data-k="${k}"><span class="k notr">${"ABCDEF"[p]}</span><span class="grow">${esc(it.o[k])}</span></button>`)));
    const finish=()=>{const good=sel.length===it.c.length&&sel.every(k=>it.c.includes(k)); if(good)ok++; record(it.id,good);
      opts.querySelectorAll(".opt").forEach(b=>{const k=+b.dataset.k;b.disabled=true;b.className="opt "+(it.c.includes(k)?"ok pop":sel.includes(k)?"no shake":"dim")});
      const fb=h(`<div class="fb ${good?"ok":"no"}"><div class="t">${good?I.check+" Tačno":I.x+" Netačno"}</div>${mcExplain(it,good)}${noteHTML(it)}${srcHTML(it)}</div>`);
      const nb=h(`<button class="btn primary block">${idx<2?"Dalje":"Rezultat"}</button>`); nb.onclick=()=>{idx++;draw()}; c.append(fb,nb); applyScript(fb); applyScript(nb)};
    opts.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const k=+b.dataset.k; if(it.c.length===1){sel=[k];finish()} else {sel=sel.includes(k)?sel.filter(x=>x!==k):sel.concat(k);b.classList.toggle("sel"); if(sel.length===it.c.length)finish()}});
    box.append(c); applyScript(box);
  }
  draw();
}

function startDeck(ids,title){
  const its=quizzable(ids);
  if(!its.length){toast("Ovde još nema pitanja");return}
  const order=its.map(i=>({i,w:weight(i)*Math.random()})).sort((a,b)=>b.w-a.w).map(x=>x.i);
  fcs={title,queue:order.map(i=>i.id),pos:0,known:0,unknown:0,orders:{},ans:null,sel:[]}; go("deck");
}
function viewDeck(v){
  if(!fcs){go("cards");return}

    keepAwake(false);
    v.append(h(`<section class="card stack" style="align-items:center;text-align:center"><div class="eyebrow">${esc(fcs.title)}</div><div class="score notr">${fcs.known}</div><div class="muted">tačnih odgovora · ${fcs.unknown} ${fcs.unknown===1?"greška":"grešaka"} (ponovljene su)</div></section>`));
    const b=h(`<div class="grid2"><button class="btn">Nazad</button><button class="btn primary">Ponovo</button></div>`);
    b.children[0].onclick=()=>{fcs=null;go("cards")}; b.children[1].onclick=()=>startDeck(fcs.queue.filter((x,i,a)=>a.indexOf(x)===i),fcs.title); v.append(b);
    if(fcs.known>=10&&fcs.unknown===0&&!fcs.cel){fcs.cel=true;confetti()} return;
  }
  keepAwake(true);
  const it=BYID[fcs.queue[fcs.pos]]; const st=S.st[it.id]||{b:0}; const ans=fcs.ans; const multi=it.c.length>1;
  const order=fcs.orders[it.id]||(fcs.orders[it.id]=optOrder(it));
  const top=h(`<div class="qtop"><button class="iconbtn" id="dX" aria-label="Zatvori vežbanje">${I.x}</button><div class="dots"><div class="bar thin grow"><i style="width:${Math.min(100,fcs.pos/fcs.queue.length*100)}%"></i></div></div><span class="qnum notr">${fcs.pos+1}/${fcs.queue.length}</span>${it.num?"":`<button class="iconbtn ${isBm(it.id)?"on":""}" id="dS" aria-label="Sačuvaj">${isBm(it.id)?I.starF:I.star}</button>`}</div>`);
  top.querySelector("#dX").onclick=()=>{fcs=null;go("cards")};
  const sb=top.querySelector("#dS"); if(sb) sb.onclick=()=>{toggleBm(it.id);sb.classList.toggle("on",isBm(it.id));sb.innerHTML=isBm(it.id)?I.starF:I.star};
  v.append(top);
  const card=h(`<article class="qcard">${it.num?`<div class="badges"><span class="badge hot">${I.hash}Broj koji moraš znati</span></div>`:badgesHTML(it,true)}<div class="qtext">${esc(it.q)}${it.num?"?":""}</div>${multi?`<div class="qhint">Više tačnih odgovora: ${it.c.length}</div>`:""}</article>`);
  const opts=h(`<div class="opts" role="group"></div>`);
  order.forEach((k,pos)=>opts.append(h(`<button class="opt" data-k="${k}"><span class="k notr">${"ABCDEF"[pos]}</span><span class="grow">${esc(it.o[k])}</span></button>`)));
  card.append(opts); v.append(card);
  const paint=()=>opts.querySelectorAll(".opt").forEach(b=>{const k=+b.dataset.k; b.className="opt";
    if(ans){b.classList.add(it.c.includes(k)?"ok":ans.sel.includes(k)?"no":"dim");b.disabled=true}
    else if(fcs.sel.includes(k))b.classList.add("sel")});
  paint();
  let chk=null;
  const submit=sel=>{ const ok=sel.length===it.c.length&&sel.every(k=>it.c.includes(k));
    record(it.id,ok); fcs.ans={sel,ok,fresh:true}; fcs.sel=[];
    if(ok)fcs.known++; else {fcs.unknown++; fcs.queue.splice(Math.min(fcs.queue.length,fcs.pos+4),0,it.id)}
    go("deck",{keep:true}) };
  opts.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ if(ans)return; const k=+b.dataset.k;
    if(!multi) submit([k]); else {fcs.sel=fcs.sel.includes(k)?fcs.sel.filter(x=>x!==k):fcs.sel.concat(k); paint(); if(chk)chk.disabled=!fcs.sel.length} });
  if(multi&&!ans){chk=h(`<button class="btn primary block" disabled>Proveri</button>`); chk.onclick=()=>submit(fcs.sel.slice()); card.append(chk)}
  if(ans){
    if(ans.fresh){ ans.fresh=false; opts.querySelectorAll(".opt.ok").forEach(b=>b.classList.add("pop")); if(!ans.ok) opts.querySelectorAll(".opt.no").forEach(b=>b.classList.add("shake")) }
    const lvl=(S.st[it.id]||{b:0}).b||0;
    const fb=h(`<div class="fb ${ans.ok?"ok":"no"}"><div class="t">${ans.ok?I.check+" Tačno":I.x+" Netačno – vratiće se za nekoliko pitanja"}</div>${mcExplain(it,ans.ok)}${noteHTML(it)}${it.num?`<div class="src">${esc(it.srcText||"")}</div>`:srcHTML(it)}<div class="row" style="justify-content:space-between"><div class="boxes" aria-label="Nivo znanja ${lvl} od 5">${[1,2,3,4,5].map(n=>`<i class="${lvl>=n?"on":""}"></i>`).join("")}</div>${it.num?"":`<button class="link quiet" id="rep">${I.alert}Prijavi grešku</button>`}</div></div>`);
    const rp=fb.querySelector("#rep"); if(rp) rp.onclick=()=>reportSheet(it);
    card.append(fb);
    const nx=h(`<div class="sticky-foot"><button class="btn primary block">Sledeće pitanje</button></div>`);
    nx.querySelector("button").onclick=()=>{fcs.pos++; fcs.ans=null; go("deck")}; v.append(nx);
  } else card.append(h(`<div class="muted small kbdhint">Tastatura: <span class="kbd">A</span>–<span class="kbd">D</span>, zatim <span class="kbd">Enter</span></div>`));
}

function itemRow(it,open,terms){
  const mk=s=>terms?markText(esc(s),terms):esc(s);
  const r=h(`<div class="li click"><div class="row" style="align-items:flex-start"><div class="q grow">${mk(it.q)}</div><button class="link quiet st" aria-label="Sačuvaj" style="padding:0">${isBm(it.id)?I.starF:I.star}</button></div><div class="more" ${open?"":"hidden"}>${it.t==="mc"?`<div class="muted small">${it.o.map((o,k)=>`${"ABCDEF"[k]}) ${mk(o)}`).join("<br>")}</div>`:""}<div class="answer" style="margin-top:6px">${it.t==="mc"?`<b>${it.c.map(k=>mk(it.o[k])).join("<br>")}</b>`:it.list?`<ul>${it.list.map(x=>`<li>${mk(x)}</li>`).join("")}</ul>`:mk(it.ans||"")}</div>${noteHTML(it)}${srcHTML(it)}</div>${badgesHTML(it,false)}</div>`);
  r.onclick=e=>{ if(e.target.closest(".st"))return; const m=r.querySelector(".more");m.hidden=!m.hidden};
  const st=r.querySelector(".st"); st.onclick=()=>{toggleBm(it.id);st.innerHTML=isBm(it.id)?I.starF:I.star};
  return r;
}
function markText(html,terms){
  let out=html;
  terms.forEach(t=>{ if(t.length<2)return;
    const pat=t.split("").map(ch=>({c:"[cčć]",s:"[sš]",z:"[zž]",d:"(?:dj|đ|d)"}[ch]||ch.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"))).join("");
    const rx=new RegExp("("+pat+")","gi");
    out=out.replace(/(<[^>]+>)|([^<]+)/g,(m,tag,txt)=>tag?tag:txt.replace(rx,"<mark>$1</mark>"));
  });
  return out;
}
