<style>
/* Layout: phone-first app shell — sticky header, one scrolling view, fixed bottom tab bar. ECG-paper grid as the one signature motif. */
:root{
  --bg:#EEF3F2; --surface:#FFFFFF; --surface-2:#F6F9F8; --ink:#12201E; --muted:#5A6B68; --line:#D6E0DE;
  --accent:#0A7A6E; --accent-ink:#FFFFFF; --accent-soft:#D8EEEA;
  --ecg:#D8465A; --ecg-soft:#FBE3E6; --grid:rgba(216,70,90,.10);
  --good:#1E8A4B; --good-soft:#DDF3E5; --bad:#C0392B; --bad-soft:#F9E0DC; --warn:#A8690F; --warn-soft:#FBEBCF;
  --gold:#B8860B; --gold-soft:#FAF0D2;
  --a1:#2a78d6; --a2:#eb6834; --a3:#1baf7a; --a1-on:#FFFFFF; --a2-on:#12201E; --a3-on:#12201E; /* boje oblasti (grafikoni) */
  --shadow:0 1px 2px rgba(18,32,30,.06),0 6px 20px rgba(18,32,30,.06);
  --f-display:"Unbounded","Onest",system-ui,sans-serif; --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:16px; --z:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1413; --surface:#141F1D; --surface-2:#1A2725; --ink:#E4EEEB; --muted:#98ABA7; --line:#26352F;
  --accent:#3CC4B2; --accent-ink:#06201C; --accent-soft:#16332F;
  --ecg:#FF6F82; --ecg-soft:#3A1D23; --grid:rgba(255,111,130,.07);
  --good:#56C784; --good-soft:#15301F; --bad:#F26D5E; --bad-soft:#3A1C18; --warn:#E6AD4E; --warn-soft:#352914;
  --gold:#E8C35A; --gold-soft:#332A12;
  --a1:#3987e5; --a2:#d95926; --a3:#199e70; --a1-on:#06201C; --a2-on:#06201C; --a3-on:#06201C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1413; --surface:#141F1D; --surface-2:#1A2725; --ink:#E4EEEB; --muted:#98ABA7; --line:#26352F;
  --accent:#3CC4B2; --accent-ink:#06201C; --accent-soft:#16332F;
  --ecg:#FF6F82; --ecg-soft:#3A1D23; --grid:rgba(255,111,130,.07);
  --good:#56C784; --good-soft:#15301F; --bad:#F26D5E; --bad-soft:#3A1C18; --warn:#E6AD4E; --warn-soft:#352914;
  --gold:#E8C35A; --gold-soft:#332A12;
  --a1:#3987e5; --a2:#d95926; --a3:#199e70; --a1-on:#06201C; --a2-on:#06201C; --a3-on:#06201C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
html{background:var(--bg);-webkit-text-size-adjust:100%;touch-action:manipulation}
body.locked{position:fixed;left:0;right:0;overflow:hidden}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.btn,.tile,.iconbtn,.big-cta,.resume,.task,.arow,.chip,.prow .pmain,nav.tabs .pill{transition:transform .12s ease,background-color .15s,border-color .15s}
.btn:active,.tile:active,.iconbtn:active,.big-cta:active,.resume:active,.task:active,.arow:active,.chip:active,.prow .pmain:active{transform:scale(.97)}
nav.tabs button:active .pill{transform:scale(.9)}
.ctgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctc{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:46px 12px 12px;min-height:124px;transition:transform .12s ease}
.ctc:active{transform:scale(.97)}
.ctc.ispit{border-color:color-mix(in srgb,var(--ecg) 45%,var(--line))}
.ctc .ctb{position:absolute;left:10px;top:10px;font:700 14px/1 var(--f-mono);padding:7px 9px;border-radius:10px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.ctc .ctb.good{background:var(--good-soft);color:var(--good);border-color:transparent}.ctc .ctb.mid{background:var(--warn-soft);color:var(--warn);border-color:transparent}.ctc .ctb.low{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.ctc .ctn{position:absolute;right:10px;top:13px;font-size:12px;font-weight:700;color:var(--muted)}
.ctc b{font-size:15px;line-height:1.25}
.ctc small{font-size:12.5px;color:var(--muted);line-height:1.3}
.install{display:flex;flex-direction:column;gap:10px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:18px;padding:14px 16px}
.install .row b{font-size:16px}
.install ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.install .shr{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--surface);border:1px solid var(--line);vertical-align:-5px;color:var(--accent)}
.install .shr svg{width:14px;height:14px}
.upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:45;border:0;border-radius:14px;background:var(--ink);color:var(--bg);padding:12px 16px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100vw - 32px);animation:up .25s}
input,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
.app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:12px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid transparent}
header.top.scrolled{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand svg{flex:none}
.brand b{display:block;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;position:relative}
.iconbtn svg{width:20px;height:20px}
.iconbtn.on{color:var(--gold);border-color:var(--gold);background:var(--gold-soft)}
.syncdot{position:absolute;right:7px;top:7px;width:8px;height:8px;border-radius:99px;background:var(--muted);border:2px solid var(--surface)}
.syncdot.ok{background:var(--good)}.syncdot.err{background:var(--warn)}
.avatar{--h:170;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:hsl(var(--h) 52% 40%);color:#fff;font-weight:800;font-size:15px;flex:none;line-height:1}
.avatar.lg{width:44px;height:44px;font-size:19px}
.iconbtn.avbtn{border-radius:50%;border-color:transparent;background:none}
.prow{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:0 6px 0 0}
.prow.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.prow .pmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;text-align:left;min-height:64px;color:var(--ink)}
.prow .pmain b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pmain small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.prow .pmark{color:var(--accent);display:grid;place-items:center}.prow .pmark svg{width:22px;height:22px}
.prow .pdel{width:40px;height:40px;border-color:transparent;background:none;color:var(--muted)}
.prow .pdel:hover{color:var(--bad)}
.pnew{display:flex;gap:8px}.pnew .field{flex:1;min-width:0}
main#view{flex:1;padding:8px 16px calc(100px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;zoom:var(--z)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs button{border:0;background:none;padding:6px 2px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);min-height:52px;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button[aria-current="page"] .pill{background:var(--accent-soft)}
nav.tabs .pill{padding:3px 14px;border-radius:999px;display:grid;place-items:center;transition:background .2s;position:relative}
nav.tabs .cnt{position:absolute;top:-2px;right:4px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--ecg);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;font-family:var(--f-mono)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.flat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.h1{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px;border-radius:12px}
.btn.block{width:100%}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45}
.btn svg,.fb .t svg,.li .mark svg{width:20px;height:20px;flex:none}
.link{border:0;background:none;padding:6px 0;color:var(--accent);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.link svg{width:16px;height:16px}
.link.quiet{color:var(--muted);font-weight:600}
.btn:focus-visible,.iconbtn:focus-visible,nav.tabs button:focus-visible,.opt:focus-visible,.tile:focus-visible,.chip:focus-visible,.link:focus-visible,.seg button:focus-visible,.task:focus-visible,.arow:focus-visible,.resume:focus-visible,.big-cta:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}
/* hero */
.greet{font-size:15px;color:var(--muted);font-weight:600;margin:2px 2px -4px}
.greet b{color:var(--ink)}
.hero{position:relative;overflow:hidden;border-radius:20px;padding:18px 18px 16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:12px 12px}
.hero .countrow{display:flex;align-items:center;gap:8px;margin:8px 0 14px}
.hero .count{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.hero .count small{font-size:15px;font-weight:500;letter-spacing:0;margin-left:6px;color:var(--muted);font-family:var(--f-body)}
.hero svg.pulse{position:absolute;right:14px;top:44px;width:100px;height:40px;opacity:.7;pointer-events:none}
.hero>*{position:relative}
.pulse path{fill:none;stroke:var(--ecg);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:no-preference){.pulse path{stroke-dasharray:260;stroke-dashoffset:260;animation:draw 2.4s ease-out .2s forwards}@keyframes draw{to{stroke-dashoffset:0}}}
.bar{height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s}
.bar.thin{height:8px}
.arow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;border:0;background:none;padding:6px 0;text-align:left;width:100%}
.arow .bar{grid-column:1/-1}
.arow b{font-weight:600}
.arow span{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;min-height:92px}
.tile b{font-size:16px;line-height:1.25}
.tile span.s{font-size:13px;color:var(--muted);line-height:1.35}
.tile.h{flex-direction:row;align-items:center;min-height:68px}
.ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.ic svg{width:20px;height:20px}
.hot .ic{background:var(--ecg-soft);color:var(--ecg)}
.warn .ic{background:var(--bad-soft);color:var(--bad)}
.gold .ic{background:var(--gold-soft);color:var(--gold)}
.big-cta{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border:0;border-radius:18px;padding:16px 18px;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.big-cta b{display:block;font-size:18px}
.big-cta span{font-size:14px;opacity:.85}
.big-cta svg{width:28px;height:28px;flex:none}
.resume{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px dashed var(--accent);background:var(--accent-soft);border-radius:16px;padding:12px 14px}
.resume svg{width:24px;height:24px;color:var(--accent);flex:none}
/* plan checklist */
.plan{margin:0;padding:0;display:flex;flex-direction:column}
.plan li{list-style:none}
.task{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 0;text-align:left;border-top:1px solid var(--line)}
.plan li:first-child .task{border-top:0}
.task .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.task.done .box{background:var(--good);border-color:var(--good);color:#fff}
.task .box svg{width:16px;height:16px}
.task.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}
.task .t{font-weight:600;line-height:1.3}

,"c":[0],"gen":1},{"id":"0000cbe","a":"zastita","t":"mc","q":"Šta je ugovor o delu?","s":[[5,20],[12,2]],"f":2,"g":930,"ans":"Potpisuje se sa licem koje nije iz delatnosti poslodavca radi obavljanja neke umne ili fizičke delatnisti.","o":["Potpisuje se sa licem koje nije iz delatnosti poslodavca, radi obavljanja neke umne ili fizičke delatnosti","Osiguranje kojim se zaposlenima i drugim licima obezbeđuje pravo na zdravstvenu zaštitu i novčane naknade u slučajevima utvrđenim zakonom","Stručno telo koje se stara o pružanju i sprovođenju zdravstvene zaštite u skladu sa načelima profesionalne etike"],"c":[0],"gen":1},{"id":"3a195f3","a":"ustav","t":"qa","q":"Ko čini Vladu?","s":[[5,20],[12,2]],"f":2,"g":931,"ans":"Predsednik, 1 ili više potpredsednika i ministri","noq":1},{"id":"a7c3712","a":"zastita","t":"mc","q":"Da li pacijent ima pravo da zna puno ime zdravstvenog radnika?","s":[[5,20]],"f":1,"g":932,"ans":"Da","o":["Da","Ne"],"c":[0]},{"id":"dd668ab","a":"zastita","t":"mc","q":"Da li glavna sestra učestvuje u stručnom savetu?","s":[[5,20],[12,2]],"f":2,"g":933,"ans":"Da","o":["Da","Ne"],"c":[0]},{"id":"379dd4c","a":"zastita","t":"mc","q":"Da li direktor učestvuje u stručnom savetu?","s":[[5,20],[12,2]],"f":2,"g":934,"ans":"Ne","o":["Da","Ne"],"c":[1]},{"id":"d5f466f","a":"zastita","t":"mc","q":"Posle koliko meseci rada može da se koristi godišnji odmor?","s":[[5,20],[12,2]],"f":2,"g":935,"ans":"Posle mesec dana rada","o":["Posle mesec dana rada","Na više nivoa zdravstvene zaštite","Osoba koja je punoletna"],"c":[0],"gen":1},{"id":"abe3060","a":"zastita","t":"mc","q":"U kom roku se polaže stručni (državni) ispit?","s":[[5,20],[12,2]],"f":2,"g":936,"ans":"12 meseci","o":["12 meseci","3 meseca","6 meseci"],"c":[0],"gen":1},{"id":"acc53bf","a":"zastita","t":"mc","q":"Šta je zarada?","s":[[5,20],[12,3]],"f":2,"g":937,"ans":"Utvrđena je pravnim aktom i ugovorom o radu. Zarada za obavljanje navedenog posla, doprinosa i drugih primanja na osnovu radnog odnosa.","o":["Utvrđena je pravnim aktom i ugovorom o radu; obuhvata zaradu za obavljeni posao, doprinose i druga primanja na osnovu radnog odnosa","Sve mere i aktivnosti kojima se povećavaju povoljni ishodi, a smanjuju rizici od nastanka neželjenih posledica po zdravlje stanovništva; provera kvaliteta može biti unutrašnja i spoljašnja","Nepokretne ili slabo pokretne, pa zahtevaju pomoć drugog lica"],"c":[0],"gen":1},{"id":"a6b9c99","a":"ustav","t":"mc","q":"Ko predlaže nosioce funkcija Narodnoj skupštini?","s":[[5,20],[12,3]],"f":2,"g":938,"ans":"Predsednik Republike","o":["Predsednik Republike","Digitalna kompresija","Uređen je Ustavom i zakonom"],"c":[0],"gen":1},{"id":"aa2350c","a":"zastita","t":"mc","q":"Šta je obavezno osiguranje?","s":[[5,20],[12,3]],"f":2,"g":939,"ans":"Osiguranje kojim se zaposlenima i drugima obezbeđuje pravo za ZZ i novčane naknade za slucajeve utvrđene zakonom.","o":["Osiguranje kojim se zaposlenima i drugim licima obezbeđuje pravo na zdravstvenu zaštitu i novčane naknade u slučajevima utvrđenim zakonom","Kada osiguranik želi sebi ili svojoj porodici da poveća obim prava ili obezbedi prava koja ne obuhvata obavezno osiguranje, ili kada nema obavezno osiguranje","Od hirurga koji predlaže operaciju"],"c":[0],"gen":1},{"id":"d40dfdc","a":"zastita","t":"mc","q":"Kakvo može biti zdravstveno osiguranje?","s":[[5,20],[12,3]],"f":2,"g":940,"ans":"Obavezno i dobrovoljno","o":["Obavezno i dobrovoljno","Na godinu dana","Upravni odbor zdravstvene ustanove"],"c":[0],"gen":1},{"id":"96e41d3","a":"zastita","t":"mc","q":"Koja druga pravna lica mogu da obavljaju zdravstvenu delatnost?","s":[[5,20],[12,3]],"f":2,"g":941,"ans":"Fakulteti, ustanove socijalne zdravstvene zaštite, zavodi za izvršenje krivicnih sankcija, ministarstvo unutrašnjih poslova, i druga lica kojima je zakonom predviđeno da obavljaju zd. delatnost.","o":["Fakulteti, ustanove socijalne zaštite, zavodi za izvršenje krivičnih sankcija, ministarstvo unutrašnjih poslova i druga lica kojima je zakonom predviđeno da obavljaju zdravstvenu delatnost","Vrstu i broj zdravstvenih radnika, dijagnostičku, terapijsku i drugu opremu, prostorije za prijem i smeštaj bolesnika, vrste i količine lekova i medicinskih sredstava","Pravo na starosnu penziju, invalidsku penziju, porodičnu penziju, naknadu pogrebnih troškova i novčanu naknadu za telesno oštećenje"],"c":[0],"gen":1},{"id":"a5ffdb2","a":"zastita","t":"mc","q":"Ko može da bude pripravnik?","s":[[5,20],[12,3]],"f":2,"g":942,"ans":"Lice koje je zavrsilo srednju, višu ili visoku skolu i prvi put stupa u radni odnos odnosno obučava se za samostalni rad.","o":["Lice koje je završilo srednju, višu ili visoku školu i prvi put stupa u radni odnos, odnosno obučava se za samostalni rad","Organizaciona jedinica za skrining u okviru zavoda za javno zdravlje","Obavezno i dobrovoljno osiguranje po svim osnovama, koje se ostvaruje uplaćivanjem doprinosa poslodavca i osiguranika"],"c":[0],"gen":1},{"id":"4a514f6","a":"zastita","t":"mc","q":"Da li se kod nas plaća pripravnički staž?","s":[[5,20],[12,3]],"f":2,"g":943,"ans":"Ne, obavlja se volonterski.","o":["Da","Ne"],"c":[1]},{"id":"271750b","a":"zastita","t":"qa","q":"Da li u sklopu dom zdravlja ima služba za transfuziju?","s":[[5,20]],"f":1,"g":944,"ans":"Nema","noq":1},{"id":"f9a0a90","a":"zastita","t":"mc","q":"U okviru čega može da se osnuje hitna pomoć?","s":[[5,20],[12,3]],"f":2,"g":945,"ans":"Samo u okviru javne svojine","o":["Samo u okviru javne svojine","Primarni nivo","Tamponada rane"],"c":[0],"gen":1},{"id":"98edac1","a":"zastita","t":"mc","q":"Da li lečenje zavisi od novčanog fonda države?","s":[[5,20],[12,3]],"f":2,"g":946,"ans":"Da","o":["Da","Ne"],"c":[0]},{"id":"8f182b0","a":"ustav","t":"mc","q":"Da li su sve vlasti povezane?","s":[[5,20],[12,3]],"f":2,"g":947,"ans":"Ne","o":["Da","Ne"],"c":[1]},{"id":"be9dc61","a":"zastita","t":"qa","q":"Svojstvo osiguranika za obavezno penzijsko i invalidsko osiguranje ne može da se steci pre?","s":[[5,20],[12,3]],"f":2,"g":948,"ans":"15 god radnog staza ili ti 65 god života","noq":1},{"id":"a7d9a63","a":"ustav","t":"mc","q":"Koji je najviši sud?","s":[[5,20],[12,3]],"f":2,"g":949,"ans":"Kasacioni sud","o":["Kasacioni sud","Narod (građani)","Predsednik Republike"],"c":[0],"gen":1},{"id":"78d19aa","a":"zastita","t":"mc","q":"Koliko privatnih praksi može osnovati zdravstveni radnik sa srednjom i visokom školom?","s":[[5,20],[12,3]],"f":2,"g":950,"ans":"Jednu","o":["Jednu","Svi članovi","Smrću zaposlenog"],"c":[0],"gen":1},{"id":"93ea8fd","a":"ustav","t":"mc","q":"Ko rukovodi vojskom?","s":[[5,20],[12,3]],"f":2,"g":951,"ans":"Predsednik Republike","o":["Predsednik Republike","Narodna skupština","Vlada"],"c":[0],"gen":1},{"id":"7205d9c","a":"zastita","t":"qa","q":"Kod kojih poslova je skraćeno radno vreme?","s":[[5,20],[12,3]],"f":2,"g":952,"ans":"Kod poslova koji su naročito teški, naporni i za zdravlje radnika štetni. Maks. 10h nedeljno i beneficiran radni staž.","noq":1},{"id":"3896f80","a":"zastita","t":"qa","q":"Šta je prekovremeno radno vreme?","s":[[5,20],[12,3]],"f":2,"g":953,"ans":"U slučaju više sile, iznenadnog oivecanja obima posla i u drugim slučajevima kada je neophodno da se u određenom roku završi posao. Najviše 4h duže ali ne sme duže od 12h dnevno, odnosno 240h godišnje.","noq":1},{"id":"f208f73","a":"ustav","t":"mc","q":"Ko čini državnu upravu?","s":[[5,20],[12,3]],"f":2,"g":954,"ans":"Ministarstva i organi državne uprave","o":["Ministarstva i organi državne uprave","Predsednik Republike","Narodna skupština"],"c":[0],"gen":1},{"id":"32582ee","a":"zastita","t":"qa","q":"Zdravstvena zaštita u punom iznosu iz sredstava obaveznog zdravstvenog osiguranja bez placenja participacije obezbeđuje se?","s":[[5,20],[12,5]],"f":2,"g":955,"ans":"Dobrovoljnim davaocima krvi koji su dali 10 i više puta krv,osim za lekove sa Liste, dobrovoljnim davaocima krvi koji su krv dali manje od 10 puta, zivim davaocima organa, slepim licima i trajno nepokretnim, ratnim vojnim invalidimacivilnim invalidima rata.","noq":1},{"id":"8689858","a":"zastita","t":"mc","q":"Kome se obezbeđuje zdravstvena zaštita u punom iznosu iz sredstava obaveznog zdravstvenog osiguranja, bez plaćanja participacije?","s":[[5,21]],"f":2,"g":955,"ans":"zivim davaocima organa, ćelija, tkiva, osim za lekove sa liste lekova.","o":["Živim davaocima organa, ćelija i tkiva, osim za lekove sa liste lekova","Hitnu medicinsku pomoć, skrining pregled, obaveznu imunizaciju, palijativno zbrinjavanje","Dom zdravlja, apotekarske ustanove, poliklinike, zavodi za zdravstvenu zaštitu studenata"],"c":[0],"gen":1},{"id":"101704a","a":"ustav","t":"mc","q":"Kod deteta starijeg od koliko godina se procenjuje sposobnost za rasuđivanje radi donošenja odluke o pristanku na medicinske mere?","s":[[5,21],[12,3]],"f":2,"g":956,"ans":"15 godina života","o":["15 godina života","Četiri godine","Pet godina"],"c":[0],"gen":1},{"id":"8c2b603","a":"zastita","t":"mc","q":"Kako zdravstveni radnik daje pacijentu obaveštenje o rizicima operacije?","s":[[5,21],[12,4]],"f":2,"g":958,"ans":"Pismeno i bez njegovog traženja","o":["Pismeno i bez njegovog traženja","Sadrži informacije koje su pacijentu potrebne da bi odlučio","Agenciju za privredne registre"],"c":[0],"gen":1},{"id":"b6bea09","a":"zastita","t":"mc","q":"Kako se daje pristanak na invazivne procedure i terapije?","s":[[5,21],[12,4]],"f":2,"g":959,"ans":"Pismeno","o":["Pismeno","Statut","Poslodavac"],"c":[0],"gen":1},{"id":"773af03","a":"zastita","t":"mc","q":"Za vreme čega poslodavac ne može da otkaže ugovor o radu zaposlenom?","s":[[5,21],[12,4]],"f":2,"g":960,"ans":"Trudnoće, porodiljskog, nege deteta, rada na određeno, vojnog roka, povrede, bolovanja,pripadnosti određenoj rasi, veri..","o":["Trudnoće, porodiljskog odsustva, odsustva radi nege deteta, vojnog roka, povrede, bolovanja; niti zbog pripadnosti određenoj rasi ili veri","Podvezivanje krvnog suda; šav krvnog suda; metalna štipaljka (klips); termokoagulacija i elektrokoagulacija","Delatnost, unutrašnja organizacija, upravljanje, poslovanje, kriterijumi za imenovanje i razrešenje direktora i zamenika direktora"],"c":[0],"gen":1},{"id":"436cc57","a":"zastita","t":"mc","q":"Ako ugovorom o radu nije utvrđeno na koje vreme se zaključuje, smatra se da je zaključen:","s":[[5,21],[12,4]],"f":2,"g":961,"ans":"Na neodređeno vreme","o":["Na neodređeno vreme","Skraćeno radno vreme","Prekovremeno i noću"],"c":[0],"gen":1},{"id":"b3c03ba","a":"zastita","t":"mc","q":"Sa kim može da se zaključi ugovor o obavljanju privremenih poslova?","s":[[5,21],[12,4]],"f":2,"g":962,"ans":"Sa nezaposlenim licem, zaposlenim sa nepunim radnim vremenom, studentom, korisnikom starosne penzije.","o":["Sa nezaposlenim licem, zaposlenim koji radi nepuno radno vreme, studentom i korisnikom starosne penzije","Na kojima se obavlja naročito težak fizički rad, rad pod zemljom, pod vodom ili na velikoj visini","Izbora, odnosno imenovanja na funkciju u državnom organu, sindikatu, političkoj organizaciji ili drugu javnu funkciju čije vršenje zahteva da privremeno prestane da radi kod poslodavca"],"c":[0],"gen":1},{"id":"3bcab82","a":"zastita","t":"mc","q":"Da li zdravstveni radnik sa odgovarajućom visokom strukovnom školom zdravstvene struke može da osnuje ordinaciju, apoteku i ambulantu zdravstvene nege?","s":[[5,21],[12,4]],"f":2,"g":963,"ans":"Ne može ordinaciju ni apoteku (ordinaciju osniva lekar, a apoteku farmaceut)","o":["Da","Ne"],"c":[1]},{"id":"7242402","a":"zastita","t":"mc","q":"Kada ambulanta za zdravstvenu negu može da počne sa radom?","s":[[5,21]],"f":1,"g":964,"ans":"Danom upisa u registar agencije za privredne resurse nakon dobijanja rešenja zdravstvenog inspektora o ispunjavanju uslova za obavljanje zdravstvene delatnosti.","o":["Danom upisa u registar Agencije za privredne registre, nakon dobijanja rešenja zdravstvenog inspektora o ispunjenosti uslova za obavljanje zdravstvene delatnosti","Ako je ne obnovi na vreme, ako načini stručnu grešku, ako bude osuđen za krivično delo, ako zloupotrebi sredstva zdravstvenog osiguranja ili ima zabranu samostalnog rada","Kada ne može da utvrdi identitet, ne može da utvrdi uzrok smrti ili posumnja na nasilnu smrt"],"c":[0],"gen":1},{"id":"943c978","a":"zastita","t":"mc","q":"Koliko najduže može da traje udaljenje zaposlenog sa rada?","s":[[5,21],[12,4]],"f":2,"g":965,"ans":"3 meseca","o":["3 meseca","6 meseci","12 meseci"],"c":[0],"gen":1},{"id":"a5dcb79","a":"zastita","t":"mc","q":"Kako se zasniva radni odnos?","s":[[5,21],[12,4]],"f":2,"g":966,"ans":"Zaključenjem ugovora o radu","o":["Zaključenjem ugovora o radu","Ambulantu za zdravstvenu negu","Pismeno i bez njegovog traženja"],"c":[0],"gen":1},{"id":"53bc867","a":"zastita","t":"qa","q":"Kada zaposlenom miruju prava i obaveze?","s":[[5,21]],"f":1,"g":967,"ans":"Za vreme sluzenja vojnog roka, upućivanja na rad u inostranstvo od strane poslodavca, izdrzavanje kazne zatvora u trajanju do 6 meseci.","noq":1},{"id":"8211f93","a":"zastita","t":"mc","q":"Koliko dana može da traje plaćeno odsustvo?","s":[[5,21],[12,4]],"f":2,"g":968,"ans":"5 dana za smrt ili bolest užeg člana porodice, sklapanje braka i očevima za rođenje deteta; 2 dana za dobrovoljno davanje krvi","o":["5 dana za smrt ili bolest užeg člana porodice, sklapanje braka i očevima za rođenje deteta; 2 dana za dobrovoljno davanje krvi","Najmanje 15 dana pre dana koji navodi kao dan prestanka radnog odnosa","Sezonski radnik je fizičko lice koje poslodavac angažuje za obavljanje sezonskih poslova uz novčanu naknadu, najduže 120 radnih dana u godini"],"c":[0],"gen":1},{"id":"5ed7738","a":"zastita","t":"qa","q":"Kada može da se promeni Ustav?","s":[[5,21],[12,4]],"f":2,"g":969,"ans":"Predlogom 1/3 poslanika. A usvaja se sa 2/3 i mora da prođe referendum od 60 dana. Narodna skupština određuje o promeni.","noq":1},{"id":"d667b31","a":"ustav","t":"qa","q":"Da li je?","s":[[5,21],[12,4]],"f":2,"g":970,"ans":"privatna praksa dužna da istakne ime sa podacima o delatnosti koja utvrđena resnjem Ministarstva zdravlja o ispunjenosti propisan  rođena pre termina imaju u velikoj količini, dok deca rođena posle 39 nedelje samo u tragovima.","p":16},{"t":"Fontanele> ima ih 6: Velika fontanela koja zarasta između 12-15 meseca, mala fontanela koja zarasta do 3 meseca i dve prednje i dve zadnje fontanele.","p":16},{"t":"Kapnometrija je praćenje CO2 u izdahnutom vazduhu.","p":16},{"t":"DiTePer je vakcina protiv difterije, tetanusa i pertusisa/velikog kašlja. Daje se posle navrsenog 2 meseca, navršenih 3,5 meseca i navršenih 6 meseci. Revakcine u drugoj godini, pre polaska u osnovnu skolu i 14 godini.","p":16},{"t":"MMR vakcina je vakcina protiv morbila/malih boginja, zausaka i rubeole. Prva doza u drugoj godini(posle navršenih 12 meseci), revakcina pre upisa u prvi razred osnovne škole.","p":16},{"t":"Odojče udvostruci ™ sa rođenja krajem 5-og meseca, utrostruci krajem prve godine, ucetvorostruci krajem druge godine. Krajem prve godine odojče je dugacko oko 73-75 cm. Krajem 5 godine dete udvostruci TD sa rođenja, a utrostruci u pubertetu.","p":16},{"t":"U trećem mesecu se potrbuške odiže na podlaktice. u četvrtom mesecu sve predmete stavlja u usta. U petom mesecu se obrce sa stomaka na leđa i obrnuto. Sesti mesec je prekretnica- sedi uz potporu, pruža obe ruke kako bi uzelo predmet. Sedmi mesec idealan za igru. U devetom mesecu premešta predmete iz ruke u ruku, počinje da razvija pincet hvat, puzi na sve četiri, sedi stabilno, počinje da se podiže uz ogradicu ili oslonac i da stoji. Deseti mesec- pokušava da napravi korake uz ogradicu, pincet hvat razvijen. 11 mesec- hoda uz pridržavanje, samostalno drži keks u ruci i gricka ga, reci izgovara-ajde, pa pa. u dvanaestom mesecu sve češće traži da hoda, koristi sve više reci u slogovima, počinje samostalno da jede...","p":16},{"t":"Centar za disanje se nalazi u produženoj moždini.","p":17},{"t":"Za svaki stepen iznad normalne temp. disanje se ubrzava za 4 respiracije, a puls za 8-12 otkucaja.","p":17},{"t":"Oksigenoterapija je primena kiseonika inhalacionim putem u terapijske svrhe. Može se dati preko maske za usta i nos, binazalne kanile, nazofaingealnog katetera, inkubatora i endotreahealnog tubusa.","p":17},{"t":"Centar za mokrenje je smešten između 3-4 lumbalnog prsljena-kicmena mozdina. Biohemijski pregled urina podrazumeva proteine-proteinurija, šećere- glikozurija, ketonska tela-ketonurija, bilirubin, urobilinogen. Urinokultura je zasejavanje urina na hranljive podloge radi izolacije uzročnika infekcije urinarnog trakta. Uvek se radi i antibiogram odnosno osetljivost bakterije koja je izolovana na određene antibiotike. Infekcija postoji ako ima više od 100 000 bakterija u 1 ml urina.","p":17},{"t":"Centar za defekaciju se nalazi u lumbosakralnom delu kičmene moždine. Koprokultura- bakteriološki pregled stolice. Kod sumnje na krvarenje u digestivnom traktu se radi test na okultno krvarenje-Adler Veber.","p":17},{"t":"Morbili/male boginje je infekcija respiratornog sistema izazvana virusom morbila. Koplikove mrlje su karateristicne za ovu infekciju. Prevencija nastanka MMR vakcina. Varičele/ovčije boginje/vodene boginje- Izaziva je virus herpesa. Imunitet nakon prelezanih boginja je trajan što znaci da više ne može da se oboli od njih. Ospa prolazi kroz nekoliko stadijuma(makula, papula, vezikula i krusta). Ospa je polimorfna što znaci da u isto vreme na koži deteta se mogu videti različiti stadijumi ospe","p":17},{"t":"Omfalokela predstavlja ispadanje trbušnih organa kroz defekt u sredisnjij liniji.","p":17},{"t":"Gatrijev test je jedan od testova u sklopu neonatalnog skrininga novorođenčadi. Podrazumeva ispitivanje dve bolesti- fenilketonurija i kongenitalna hipotireoza. Fenilketonurija je nasledna metabolička bolest kod koje se aminokiselina fenilalanin ne razgradjuje u organizmu nego se nagomilava izazivajući oštećenja CNS-a, Urođena hipotireoza je urođena smanjena funkcija štitne žlezde, ona u smanjenoj količini ili uopšte ne proizvodi hormone tiroksin i trijodtironin. Izgled nn: ostra gusta kosa, široko lice grubih crta,veliki jezik koji viri iz usta. Ako se ne leci dovodi do mentalnog propadanja.","p":17},{"t":"Prva stolica koju dete ima se zove mekonijum, tamno zelena, sluzava i predstavlja mesavinu amnionske tečnosti, žuči i sekreta iz crevnih žlezda.","p":17},{"t":"Novorođenče koje majka doji ima oko 5 mokrih pelena dnevno, dok bebe na dohrani imaju 10ak.","p":17},{"t":"Prednosti dojenja: majčino mleko je prilagodjeno potrebama deteta i menja se u skladu sa tim kako dete raste; lakše se vari u odnosu na kravlje mleko; deluje blagotvorno na stomak deteta; sprečava alergije i infekcije, jača vilicu.","p":17},{"t":"Posle prvog rodjendana detetu uvoditi kravlje mleko u ishranu. Prvo se daje punomasno mleko jer im je neophodan visok sadržaj esencijalnih masnih kiselina koje su važne za njihov rast i razvoj mozga.","p":17},{"t":"Skrining test prvog tromesecja koji se najčešće radi u trudnoći je Dabl test.To je kombinovani test, sastoji iz ultrazvucnog pregleda i uzimanja krvi. Sluzi za utvrđivanje postojanja hromozomskih aberacija- Daunov sindrom. Najčešće se radi između 11 i 14 nedelje trudnoće. Biopsija horionskih cupica-analiza koja se radi između 11 i 12 nedelje trudnoće i koja pokazuje da li dete ima neki genetski ili hromozomski poremećaj. Amniocenteza je pregled plodove vode=radi se u drugom tromesecju","p":17},{"t":"Kordocenteza je invazivna metoda prenatalnog testiranja u kojoj se uzima uzorak krvi bebe iz pupčanika. Između 18 i 24 nedelje. Sluzi za otkrivanje hromozomskih aberacija, bolesti krvi kao što je fetalna anemija i ako je majka bila zarazena npr. rubeolom, da li je i dete zarazeno.","p":17},{"t":"Fiziološka žutica/ikterus je stanje koje izaziva zutu prebojenost kože i beonjaca. Javlja se najčešće između 2 i 7 dan od rođenja. Nastaje kada nezrela jetra nn ne može da obradi dovoljno brzo eritrocite kojih ima mnogo i bilirubin počinje da se povećava u krvi. Lekar može prepisati fototerapiju.","p":17},{"t":"Ako novorođenče ima manje od 2500 grama smatra se da ima malu telesnu masu bez obzira da li je dete rođeno pre termina ili u terminu. Uzroci: genetika, prevremeno rodjenje, blizanacka trudnoća, ako je postojao neki problem sa posteljicom u trudnoći, stres u trudnoći","p":18},{"t":"Apgar skor je pregled nn u prvom i petom minutu posle porođaja. Ocenjuje se disanje, puls, refleksi, tonus mišića i boja kože. Ocena za svaki parametar je od 0-2","p":18},{"t":"Ultrazvučni pregled kukova je jedna od metoda ranog otkrivanja razvojnog poremećaja kuka. Primarni pregled u porodilištu, a najkasnije do mesec dana po rođenju, a sekundarno snimanje je u drugom mesecu.","p":18},{"t":"Tortikolis je jedan od najčešćih deformiteta kod nn, krivi vrat. Dešava se kada je mišić sa jedne strane vrata skraćen, pa beba naginje glavu na tu stranu i okreće lice u suprotnu. Ukoliko se primeti na vreme uz fizikalnu terapiju stanje se popravlja.","p":18},{"t":"Patronažna sestra će majku savetovati da se obavezno javi pedijatru u savetovalište ako odojče sa šest meseci još nije svoju težinu: udvostrucilo u odnosu na porodjajnu.","p":18},{"t":"Natalitet je broj živorođene dece u odnosu na broj stanovnika.","p":18},{"t":"Voda kod odojčeta čini i do 75% ukupne telesne mase pa su posledice gubitka tečnosti kod dece teške. Gubitak tečnosti u visokom stepenu preko 6% telesne mase se može prepoznati po: žeđ, suve usne, obložen jezik, suva koža bez turgora, upale oči, uvucena fontanela kod beba, puls se ubrzava, pada pritisak.","p":18},{"t":"Kefalhematom- krvni podliv na glavi nn koji nastaje tokom porođaja. Obično se vezuje za upotrebu forcepsa ili vakum-ekstraktora. Th uglavnom nije potrebna. Porođajni naduv je izrazit otok mekih tkiva koji se javlja na predjacecem delu glave pri rađanju. Th nije potrebna.","p":18},{"t":"Spina Bifida- malformacija u predelu kičme. Moždane opne zajedno sa oštećenim delom kičmene moždine se nalaze van kičmenog kanala. Spada u defekt neuralne cevi.","p":18},{"t":"Omfalitis je infekcija pupka.","p":18},{"t":"Kod nn i odojčadi se ne preporučuje Hajmlihov zahvat radi oslobađanja disajnih puteva. nn postupak- uhvatiti dete za noge, podignuti uvis i lupkati po leđima između lopatica. odojče postupak- potrbuške na podlakticu tako da glava leži na dlanu i usmerena ka dole. lupkati 5x između lopatica. Ako strano telo ne ispadne okrenuti ga na leđa i pritisnuti sa dva prsta na sredinu grudne kosti.","p":18}],"notes":{"numbers":[{"k":"KPR – odnos kompresija i udisaja","v":"30 : 2","s":"Februarski rok, str. 1"},{"k":"Frekvencija kompresija sternuma (odrasli)","v":"do 120/min","s":"KMST zbirka, str. 17 · Skripta 1678…, str. 5","o":["Do 120/min","8-12 respiracija/min","60–80 u minuti"]},{"k":"Ulegnuće grudnog koša pri kompresiji (odrasli)","v":"4–5 cm","s":"Pitanja stručni ispit, str. 6 (u skripti 1678, str. 5: 5–6 cm)","o":["4–5 cm","2-3 cm","10 cm"]},{"k":"Provera disanja i pulsa kod osobe bez svesti","v":"do 10 s","s":"KMST zbirka, str. 3 · Skripta 1678…, str. 12","o":["Do 10 s","30 s","60 sekundi kontinuirano"]},{"k":"Respiracije – odrasli","v":"18–20/min","s":"ZDR nega (bitno), str. 1 · Nova pitanja 1. dec, str. 1","o":["18–20/min","60–80/min","8-12 respiracija/min"]},{"k":"Respiracije – deca","v":"20–22/min","s":"ZDR nega (bitno), str. 4 · Nova pitanja 1. dec, str. 3","o":["20–22/min","60–80/min","8-12 respiracija/min"]},{"k":"Puls – odrasli","v":"60–80/min","s":"Nega 2 (udžbenik), str. 8 · Skripta 1678…, str. 2","o":["60–80/min","18–20/min","8-12 respiracija/min"]},{"k":"Puls – novorođenče / odojče / malo dete","v":"120–140 / 110–120 / 100–110","s":"Skripta 1678…, str. 2"},{"k":"Krvni pritisak – sistolni / dijastolni","v":"120–140 / 60–80 mmHg","s":"Skripta 1678…, str. 5"},{"k":"pH krvi","v":"7,35–7,45","s":"Skripta 1678…, str. 9"},{"k":"Metabolička acidoza","v":"pH ispod 7,35","s":"ZDR nega (bitno), str. 4 · Nova pitanja 1. dec, str. 4"},{"k":"Gustina urina","v":"1012–1025","s":"ZDR nega (bitno), str. 3 · Nova pitanja 1. dec, str. 3"},{"k":"Normalna diureza","v":"1200–1500 ml","s":"Skripta 167 "Mandat predsednika Republike / Vlade","v":"5 godina / 4 godine","s":"USTAV, str. 1 i 3","o":["5 godina / 4 godine","Navršenih 15 godina","2 godine"]}],"topics":[{"title":"Sterilizacija, dezinfekcija, asepsa","src":"Sterilizacija; Nova pitanja 1. dec; Nova pitanja 4. dec; KMST zbirka; Skripta 1678…","sections":[{"h":"Pojmovi","items":["Sterilizacija je potpuno uništavanje mikroorganizama i njihovih spora sa predmeta, materijala i instrumenata koji dolaze u kontakt sa pacijentom ili ranom. To je metoda asepse.","Asepsa se postiže sterilizacijom, antisepsa dezinfekcijom.","Dezinfekcija je delimično uništavanje mikroorganizama sa kože, predmeta i materijala.","Dezinfekcija po toku: početna, dezinfekcija u toku, završna."]},{"h":"Metode sterilizacije","items":["Toplotna: suva toplota (suvi sterilizator) i vlažna toplota (autoklav).","Hemijska: gasovima (etilen-oksid, formaldehid) ili potapanjem.","Posebne: jonizujuće zračenje, UV zraci, ultrazvuk, plazma, filtriranje.","Najbolja METODA sterilizacije je fizička; najpouzdanija KONTROLA sterilizacije je biološka."]},{"h":"Aparati i vrednosti","items":["Suvi sterilizator: 160 °C – 2 h ili 180 °C – 1 h; vreme se računa od postizanja temperature. Steriliše metal, staklo, porcelan, keramiku.","Autoklav (vodena para pod pritiskom): metalni instrumenti, gumeni predmeti, tekstil i stakleni predmeti. Tekstil: 134 °C, 2,5 bara.","Etilen-oksid: „hladna” sterilizacija termolabilnog materijala (optika, implantati); na ispitu 55 °C.","Plazma (vodonik-peroksid): sočiva i kamere endoskopa; 45–55 min, 47–56 °C.","UV lampe sterilišu vazduh u sali (12–18 h).","Materijal u zatvorenom dobošu ili kaseti je sterilan 72 h, a posle otvaranja 24 h."]},{"h":"Kontrola sterilizacije","items":["Fizička (termometri, manometri), hemijska (indikator trake) i biološka (bakteriološka) – najpouzdanija.","Mukolicev papir služi za kontrolu uspešnosti sterilizacije."]},{"h":"Dezinficijensi","items":["Vrste: alkoholni, hlorni i jodni preparati, jedinjenja amonijaka, fenoli.","Alkoholom se dezinfikuje neoštećena koža; hidrogenom (3% H₂O₂) se čiste rane, ali ne duboke.","Dezinfekcija ruku traje najmanje 30 s."]}],"ids":["6261b01","a5896f9","f1c74f4","62f3cea","f2586c8","e344e48","9dfe3ab","d46f798","de57a73","32502e0","5668147","5bd3d60","dce171c","6970df5","588df57","e2a53cc","ecbe887","01f96f3","b9eed2b","bbe8146","ac4f62c","884a281","7518a00","1df22f0","78cc222","74c883c","1843604","b7611f8","d394d38","c926108","07f6ec9","3ebe9a7","db21115","9453297","5adbab2","b46d47d","44f55df","224dfed","020f9a0","e683b22","fafbe24","0c60856","60b3e3f","f7d16ae","3fe6c14","4d4486d","1a46a4e","1d16c3e","f0f3f6d","a61b994","39424f2","ac333d1","aab4b67","24ba8fe","ca86a3a","fc2b7b1","38820f1","63138a7","c53d259","5241126","f6e8830","e167550","579bcbf","ee56be0","2b3d154","3440f14","92c8634","3c9e464","9c23b5d","266b54b"]},{"title":"Krvarenje i hemostaza","src":"KMST zbirka; Skripta 1678…; ZDR nega (bitno); Nova pitanja 4. dec; Pitanja stručni ispit","sections":[{"h":"Podela krvarenja","items":["Po mestu: spoljašnje i unutrašnje. Izlivanje krvi iz unutrašnjih organa preko prirodnih puteva spada u spoljašnje krvarenje.","Po vremenu nastanka: primarno i sekundarno (sekundarno nastaje posle određenog vremena od povrede).","Po vrsti krvnog suda: arterijsko, vensko, kapilarno (mešovito).","Arterijsko: brzo i obilno, u mlazevima, svetlocrvena krv."]},{"h":"Hemostaza","items":["Privremena: digitalna kompresija, hiperfleksija ekstremiteta (prinudna fiksacija), tamponada rane, Esmarhova poveska.","Definitivna (trajna): podvezivanje (ligatura), šav (sutura) krvnog suda, metalna štipaljka (klips), termo- i elektrokoagulacija.","Tamponada rane spada i u privremenu i u definitivnu hemostazu.","Arterijsko krvarenje se digitalnom kompresijom zaustavlja IZNAD mesta krvarenja.","Kod svakog krvarenja prvo se radi digitalna kompresija.","Iskrvavljenog stavljamo u položaj autotransfuzije: na leđa sa blago podignutim nogama."]}],"ids":["9ab125c","41b31e7","fc 0–1500 ml; oligurija < 500 ml, anurija < 100 ml.","Glikozurija – šećer u urinu; proteinurija – belančevine; dizurija – otežano i bolno mokrenje; retencija – nemogućnost pražnjenja bešike.","Urinokultura određuje vrstu i broj mikroorganizama u urinu.","Melena je crna stolica (krvarenje iz gornjih partija digestivnog trakta); steatoreja je masna stolica.","Koprokultura je mikrobiološki pregled stolice; za okultno krvarenje uzima se stolica."]}],"ids":["fa13841","64abb3f","16d19bf","adfa651","b9b79bb","28f6fb7","84a7902","86f5e9f","b980e3a","893f9d7","5668147","5bd3d60","ec37cc8","64b5d28","97bec48","92382e6","33653f9","7a68efe","14cfdf1","5f0a7d0","3bceef0","ec69a00","cc9c5f7","82cbd15","01759f6","9b5faf3","df52985","89c4b7f","44193d1","2f5166f","28eefb3","7a6a92a","d32b8cd","2b53e62","cb09135","c7815a6","ed1ecb1","e7481ef","b964643","d0f334d","6b4b532","11429e7","67a8190","d50a03f","595d3db","99d3373","1a410df","cbc421d","2b9da29","978f2ea","854b9cb","70e4f54","58f7a28","8010ec6","63f9ff3","5cd5cae","6fd0600","cffe3b2","3f0cb5c","f3003af","bf86873","a3111fa","51719f1","ec87604","a61b709","1613bb0","01bbc49","d17ee4f","083f411","97e38c8","eb344b9","bea10d3","ca868ab","edfdb1c","c5d9885","890b456","c70a1e7","60fd799","ff5a8a1","597a452","66e4f45","1d34f7e","27dba53","2b3d154","92324b9","ecd9296","5bc448e","5455fca","178ca5b","50d8870","6f24eeb","dbe17ca","69f4640","692b95d","99abc28","d8c9f99","4aa665d","1b9fcb8","266b54b","14045dd","78a2a05","98213cb","b856aa2","9168d14","d0627f9"]},{"title":"Aplikacija lekova","src":"Nega 2 (udžbenik); Skripta 1678…; ZDR nega (bitno); Nova pitanja 4. dec","sections":[{"h":"Putevi","items":["Parenteralno = mimo digestivnog trakta (i.v., i.m., s.c., i.d.); infuzije se daju parenteralno.","Intravenski se ubrizgavaju samo vodeni rastvori.","Intramuskularno najviše 5 ml, u gornji spoljašnji ugao gluteusa (da se ne povredi n. ischiadicus).","Heparin subkutano pod uglom od 90°.","Transdermalno: nitroglicerin i opijati. Nitroglicerin se daje let DB=null, REF=null, syncState="local", writing=Promise.resolve(), pushed=0, syncT=null, cloudRO=false, resolveDb;

function mergeState(a,b){
  const o=normState(JSON.parse(JSON.stringify(a))); b=normState(b);
  Object.keys(b.st).forEach(id=>{const x=o.st[id],y=b.st[id]; if(!y)return; if(!x||(y.t||0)>(x.t||0)||((y.t||0)===(x.t||0)&&y.n>x.n))o.st[id]=y});
  ["days","ok"].forEach(k=>Object.keys(b[k]).forEach(d=>{o[k][d]=Math.max(o[k][d]||0,b[k][d]||0)}));
  const seenT=new Set(o.hist.map(x=>x.t)); b.hist.forEach(x=>{if(!seenT.has(x.t))o.hist.push(x)}); o.hist.sort((x,y)=>x.t-y.t); o.hist=o.hist.slice(-120);
  Object.keys(b.bm).forEach(id=>{if(Math.abs(b.bm[id])>Math.abs(o.bm[id]||0))o.bm[id]=b.bm[id]});
  Object.assign(o.rep,b.rep);
  Object.keys(b.ct).forEach(id=>{const x=o.ct[id],y=b.ct[id]; if(!y)return; if(!x||(y.n||0)>(x.n||0)||((y.n||0)===(x.n||0)&&(y.t||0)>(x.t||0))){o.ct[id]=Object.assign({},y,{best:Math.max(y.best||0,x?x.best||0:0)})} else x.best=Math.max(x.best||0,y.best||0)});
  if((b.settings.t||0)>(o.settings.t||0))o.settings=b.settings;
  o.qdone=Math.max(a.qdone||0,b.qdone||0);
  const qa=a.quiz,qb=b.quiz; let q=(qa&&qb)?((qb.t||0)>(qa.t||0)?qb:qa):(qa||qb); if(q&&(q.t||0)<=o.qdone)q=null; o.quiz=q;
  o.lastOpen=Math.max(a.lastOpen||0,b.lastOpen||0); o.upd=Math.max(a.upd||0,b.upd||0);

}
function scheduleSync(){ if(!REF||cloudRO)return; clearTimeout(syncT); syncT=setTimeout(pushRemote,2500) }
function pushRemote(){
  if(!REF||cloudRO||!DB||S.upd<=pushed)return writing;
  const ref=REF, iref=DB.doc("profiles/"+PROF.active), slug=PROF.active, at=S.upd;
  const body=JSON.parse(JSON.stringify(S)); if(JSON.stringify(body).length>240000)body.hist=body.hist.slice(-30);
  const t=totals(S), idx={name:S.settings.name,n:t.n,k:t.k,u:at};
  writing=writing.then(()=>ref.set(body)).then(()=>iref.set(idx)).then(()=>{ if(slug===PROF.active){pushed=Math.max(pushed,at);setSync("ok")} })
    .catch(e=>{ const c=e&&e.code; if(c==="invalid_argument"){cloudRO=true;setSync("ro")} else if(c==="revoked"||c==="not_granted"||c==="capability_disabled"||c==="capability_removed"){DB=null;REF=null;setSync("local")} else setSync("err") });

function stateSig(){return JSON.stringify([Object.keys(S.st).length,S.hist.length,Object.keys(S.bm).length,S.settings,S.quiz&&S.quiz.t])}
async function pullRemote(){

    const snap=await DB.doc("progress/"+slug).get();
    if(slug!==PROF.active||!DB)return;
    const had=hasProgress(S);
    if(snap.exists){ const before=stateSig(); S=mergeState(S,snap.data()); S.settings.name=PROF.list[slug].name; writeLocal(); applyTheme(); updateAvatar();
      if(stateSig()!==before){ if(!had&&hasProgress(S))toast("Učitan je sačuvan napredak"); if(!["quiz","deck"].includes(current)&&!document.querySelector(".scrim"))go(current,{keep:true}) } }

async function migrateAccount(user,db){

  const o=normState(snap.data()); const nm=cleanName(o.settings.name)||(PROF.active?PROF.list[PROF.active].name:""); const slug=slugOf(nm); if(!slug)return;
  if(slug===PROF.active){ S=mergeState(S,o); S.settings.name=PROF.list[slug].name; writeLocal() }

const L2C = {"lj":"љ","nj":"њ","dž":"џ","Lj":"Љ","LJ":"Љ","Nj":"Њ","NJ":"Њ","Dž":"Џ","DŽ":"Џ",

const KEEP_RX = /^(?:[A-Z]{2,6}|[a-z]*[A-Z][a-zA-Z]*[A-Z][a-zA-Z]*|pH|Rh|mmHg|x)$/;
function wordToCyr(w){
  if(KEEP_RX.test(w)) return w;
  let out="",i=0; const lw=w.toLowerCase();
  const noDig=/^(injek|konjunk|konjug|vanjez|nadživ|podžel|nadžn|odživ)/.test(lw);
  while(i<w.length){const two=w.substr(i,2); if(!noDig&&L2C[two]!==undefined){out+=L2C[two];i+=2;continue} const ch=w[i]; out+=(L2C[ch]!==undefined?L2C[ch]:ch); i++}

function weight(i){
  const s=S.st[i.id]; let w=1;
  if(i.x) w*=2.2; if(i.f>=2) w*=1+0.5*Math.min(i.f,4);
  if(i.t==="mc") w*=1.3;
  if(!s||!s.n) w*=1.4; else if(s.l===0) w*=3; else if(s.b>=3) w*=0.25; else if(s.b>=2) w*=0.5;
  if(i.u) w*=0.7;
  return w;
}
function pick(pool,n){
  const res=[],groups=new Set(); const cand=pool.slice();
  while(res.length<n&&cand.length){
    let tot=0; const ws=cand.map(i=>{const w=weight(i);tot+=w;return w});
    let r=Math.random()*tot,idx=0; for(;idx<cand.length;idx++){r-=ws[idx];if(r<=0)break}
    const it=cand.splice(Math.min(idx,cand.length-1),1)[0];
    if(it.g!=null&&groups.has(it.g))continue; if(it.g!=null)groups.add(it.g); res.push(it);
  }
  return res;
}
/* Pravilo ispita: 15 pitanja = 9 iz zdravstvene nege + 3 iz zdravstvene zaštite + 3 iz Ustava, tim redom kao na
   pravom testu. Po njemu se sastavlja svaki test iz više oblasti (za drugi broj pitanja ista razmera 9 : 3 : 3). */
const EXAM_RULE=[["nega",9],["zastita",3],["ustav",3]], EXAM_N=15;
const RULE_TEXT="9 iz nege, 3 iz zdravstvene zaštite, 3 iz Ustava";
function ruleCounts(n,areas){
  const r=EXAM_RULE.filter(([a])=>!areas||areas.includes(a)), tot=r.reduce((s,[,w])=>s+w,0);
  const raw=r.map(([,w])=>n*w/tot), c=raw.map(Math.floor); let rest=n-c.reduce((x,y)=>x+y,0);
  raw.map((x,i)=>[x-c[i],i]).sort((p,q)=>q[0]-p[0]).forEach(([,i])=>{if(rest>0){c[i]++;rest--}});
  return r.map(([a],i)=>[a,c[i]]);
}
function examOrder(items){ return EXAM_RULE.flatMap(([a])=>shuffle(items.filter(i=>i.a===a))).concat(shuffle(items.filter(i=>!EXAM_RULE.some(([a])=>a===i.a)))) }
function byRule(pool,o){ o=o||{}; let out=[], filled=0;
  ruleCounts(o.n||EXAM_N,o.areas).forEach(([a,c])=>{ const src=pool.filter(i=>i.a===a); let got=o.random?shuffle(src).slice(0,c):pick(src,c);
    if(got.length<c&&o.fill){ const more=pick(o.fill.filter(i=>i.a===a&&!got.includes(i)&&(i.g==null||!got.some(x=>x.g===i.g))),c-got.length); filled+=more.length; got=got.concat(more) }
    out=out.concat(got) });
  return {items:examOrder(out),filled};
}

function answerStats(){
  const per={}; Object.keys(AREAS).forEach(a=>per[a]={n:0,k:0,q:0}); let n=0,k=0,q=0;
  Object.keys(S.st).forEach(id=>{const s=S.st[id], it=BYID[id]; if(!it||!s||!s.n)return; const a=per[it.a]?it.a:"nega", kk=Math.min(s.k||0,s.n);
    per[a].n+=s.n; per[a].k+=kk; per[a].q++; n+=s.n; k+=kk; q++});
  return {n,k,w:n-k,q,per};
}
function pctParts(vals){ // procenti koji se sabiraju u 100 (najveći ostatak)
  const tot=vals.reduce((a,b)=>a+b,0); if(!tot)return vals.map(()=>0);
  const raw=vals.map(x=>x*100/tot), fl=raw.map(Math.floor); let rest=100-fl.reduce((a,b)=>a+b,0);
  raw.map((x,i)=>[x-fl[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{if(rest>0){fl[i]++;rest--}}); return fl;
}
function arcPath(cx,cy,r1,r2,a0,a1){
  const p=(r,a)=>[(cx+r*Math.cos(a)).toFixed(2),(cy+r*Math.sin(a)).toFixed(2)];
  if(a1-a0>=Math.PI*2-1e-6){ // ceo krug
    return `M${cx-r2} ${cy}A${r2} ${r2} 0 1 1 ${cx+r2} ${cy}A${r2} ${r2} 0 1 1 ${cx-r2} ${cy}ZM${cx-r1} ${cy}A${r1} ${r1} 0 1 0 ${cx+r1} ${cy}A${r1} ${r1} 0 1 0 ${cx-r1} ${cy}Z` }
  const big=a1-a0>Math.PI?1:0, [x1,y1]=p(r2,a0),[x2,y2]=p(r2,a1),[x3,y3]=p(r1,a1),[x4,y4]=p(r1,a0);
  return `M${x1} ${y1}A${r2} ${r2} 0 ${big} 1 ${x2} ${y2}L${x3} ${y3}A${r1} ${r1} 0 ${big} 0 ${x4} ${y4}Z`;
}

  sum.append(h(`<div class="sum3"><div class="ok"><b class="notr">${I.check}${t.k}</b><span>tačno</span><span class="notr">${pk}%</span></div><div class="no"><b class="notr">${I.x}${t.w}</b><span>netačno</span><span class="notr">${100-pk}%</span></div><div><b class="notr">${t.q}</b><span>različitih</span><span>pitanja</span></div></div>`));
  v.append(sum);

  const cx=100,cy=100,r2=97,r1=52; let a=-Math.PI/2, paths="", labels="";
  keys.forEach((k,i)=>{ if(!vals[i])return; const da=vals[i]/t.n*Math.PI*2, a1=a+da;
    paths+=`<path d="${arcPath(cx,cy,r1,r2,a,a1)}" fill="${AREA_COLOR[k]}" data-a="${k}" tabindex="0" role="img" aria-label="${AREAS[k]}: ${pc[i]}%, ${vals[i]} odgovora"></path>`;
    if(pc[i]>=7){const m=(a+a1)/2, rr=(r1+r2)/2; labels+=`<text class="pl notr" data-a="${k}" x="${(cx+rr*Math.cos(m)).toFixed(1)}" y="${(cy+rr*Math.sin(m)).toFixed(1)}" text-anchor="middle" dominant-baseline="central" fill="${AREA_ON[k]}">${pc[i]}%</text>`}
    a=a1 });
  const wrap=h(`<div class="pie-wrap"><svg class="pie" viewBox="0 0 200 200" role="group" aria-label="Udeo oblasti u odgovorima">${paths}${labels}<text class="c1 notr" x="100" y="96" text-anchor="middle"></text><text class="c2" x="100" y="120" text-anchor="middle"></text></svg><div class="plg"></div></div>`);
  const svg=wrap.querySelector("svg"), lg=wrap.querySelector(".plg"), c1=svg.querySelector(".c1"), c2=svg.querySelector(".c2");
  keys.forEach((k,i)=>{ const x=t.per[k], p=x.n?Math.round(x.k/x.n*100):0;
    const b=h(`<button data-a="${k}" aria-pressed="false"><span class="sw" style="background:${AREA_COLOR[k]}"></span><b>${AREAS[k]}</b><span class="pp notr">${pc[i]}%</span><small>${x.n?`<span class="notr">${x.n}</span> odgovora · tačno <span class="notr">${x.k}</span> · netačno <span class="notr">${x.n-x.k}</span> · uspešnost <span class="notr">${p}%</span>`:"još nema odgovora"}</small></button>`);
    lg.append(b)});
  let sel=null, hov=null;
  const paint=()=>{ const cur=hov||sel; svg.classList.toggle("sel",!!cur); lg.classList.toggle("sel",!!cur);
    svg.querySelectorAll("path,.pl").forEach(e=>e.classList.toggle("on",e.dataset.a===cur));

    if(S.settings.script==="cyr")c2.textContent=toCyr(c2.textContent) };
  const pick=k=>{sel=sel===k?null:k; paint()};
  svg.querySelectorAll("path").forEach(e=>{ e.onclick=()=>pick(e.dataset.a); e.onkeydown=ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();pick(e.dataset.a)}};
    e.onpointerenter=ev=>{if(ev.pointerType==="mouse"){hov=e.dataset.a;paint()}}; e.onpointerleave=()=>{hov=null;paint()}; e.onfocus=()=>{hov=e.dataset.a;paint()}; e.onblur=()=>{hov=null;paint()} });
  lg.querySelectorAll("button").forEach(e=>e.onclick=()=>pick(e.dataset.a));
  paint(); card.append(wrap); v.append(card);
}

function ctCard(c){
  const r=S.ct[c.id]; const n=c.ids.length; const cnt={}; c.ids.forEach(id=>{const a=BYID[id].a; cnt[a]=(cnt[a]||0)+1});
  const mix=Object.keys(AREAS).filter(a=>cnt[a]).map(a=>`${AREA_SHORT[a]} ${cnt[a]}`).join(" · ");
  const p=r?Math.round((r.last||0)/Math.max(1,r.tot||n)*100):null;
  const b=h(`<button class="ctc ${c.g}"><span class="ctb ${p==null?"":p>=80?"good":p>=50?"mid":"low"} notr">${r?`${r.last}/${r.tot||n}`:"Novo"}</span>${r?`<span class="ctn notr">${r.n}×</span>`:""}<b>${esc(c.t)}</b><small>${n} pitanja · ${mix}${c.fill?` · dopunjeno ${c.fill}`:""}</small>${r?`<small>najbolje <span class="notr">${r.best}/${r.tot||n}</span></small>`:""}</button>`);
  b.onclick=()=>startQuiz({mode:"ct",ct:c.id}); return b;
}

    const p=pool(), n=p.length, plan=ruleCounts(cfg.n,cfg.areas); const short=plan.filter(([a,c])=>p.filter(i=>i.a===a).length<c).map(([a])=>AREA_SHORT[a]);

function startQuiz(o){
  const pool=TESTABLE;
  let items=[], title="Brzi test", timed=0, r=null;
  // svaki test iz više oblasti ide po pravilu ispita (9 + 3 + 3); test jedne oblasti ili teme ostaje iz te oblasti
  if(o.mode==="brzi"){r=byRule(pool)}
  else if(o.mode==="oblast"){items=pick(pool.filter(i=>i.a===o.area),15);title=AREAS[o.area]}
  else if(o.mode==="rok"){r=byRule(pool.filter(i=>i.x),{fill:pool});title="Sa pravih rokova"}
  else if(o.mode==="cesto"){r=byRule(pool.filter(i=>i.f>=2),{fill:pool});title="Najčešća pitanja"}
  else if(o.mode==="greske"){const w=pool.filter(wrongLast); if(w.length)r=byRule(w,{random:true,fill:pool.filter(i=>!known(i))});title="Moje greške"}
  else if(o.mode==="bm"){const b=quizzable(bmIds()).filter(i=>!i.num); if(b.length)r=byRule(b,{random:true,fill:pool.filter(i=>!known(i))});title="Sačuvana pitanja"}
  else if(o.mode==="sim"){r=byRule(pool);title="Ispit – kao pravi"}
  else if(o.mode==="ct"){const c=CTBY[o.ct]; if(c){items=examOrder(c.ids.map(id=>BYID[id]).filter(Boolean));title=c.t}}
  else if(o.mode==="ids"){items=quizzable(o.ids);title=o.title||"Test"}
  if(r){items=r.items; if(r.filled)toast(o.mode==="greske"||o.mode==="bm"?`Dopunjeno sa ${r.filled} pitanja koja još ne znaš, da raspored bude kao na ispitu (${RULE_TEXT}).`:`Dopunjeno sa ${r.filled} pitanja, da raspored bude kao na ispitu.`)}
  if(!items.length){toast(o.mode==="bm"?"Još nemaš sačuvanih pitanja":o.mode==="greske"?"Nema grešaka – samo napred!":"Nema pitanja za ovaj izbor");return}
  beginQuiz({mode:o.mode,area:o.area,title,items,timed,ctid:o.mode==="ct"?o.ct:undefined});
}
function beginQuiz(o){
  quiz={mode:o.mode,area:o.area,title:o.title,items:o.items,idx:0,answers:[],start:Date.now(),timed:o.timed||0,sim:o.mode==="sim",sel:[],reveal:false,ctid:o.ctid};
  quiz.orders=quiz.items.map(it=>it.t==="mc"?optOrder(it):null);
  persistQuiz(); go("quiz");
}
function persistQuiz(){ if(!quiz){S.quiz=null;S.qdone=Date.now();save();return}
  S.quiz={mode:quiz.mode,area:quiz.area,title:quiz.title,items:quiz.items.map(i=>i.id),orders:quiz.orders,answers:quiz.answers.map(a=>a||null),idx:quiz.idx,start:quiz.start,timed:quiz.timed,sim:quiz.sim,ctid:quiz.ctid,t:Date.now()}; save() }
function resumeQuiz(){
  const q=S.quiz; if(!q)return; const items=q.items.map(id=>BYID[id]).filter(Boolean);
  if(!items.length||items.length!==q.items.length||items.some(i=>i.t!=="mc")){S.quiz=null;save();toast("Test ne može da se nastavi, počni novi");go("home");return}
  quiz={mode:q.mode,area:q.area,title:q.title,items,idx:Math.min(q.idx||0,items.length-1),answers:(q.answers||[]).map(a=>a||undefined),start:q.start,timed:q.timed,sim:q.sim,ctid:q.ctid,sel:[],reveal:false,orders:items.map((it,k)=>q.orders&&q.orders[k]&&q.orders[k].length===it.o.length?q.orders[k]:optOrder(it))};
  if(quiz.answers[quiz.idx]&&quiz.idx+1<items.length) quiz.idx++;
  if(!quiz.timed) quiz.start=Date.now()-5000;
  go("quiz");
}
function optOrder(it){
  const idx=it.o.map((_,k)=>k);
  if(it.o.some(o=>/sve navedeno|ništa od navedenog|nijedan odgovor|tačno je i pod|sve je tačno/i.test(o))||it.o.every(o=>/^(da|ne)$/i.test(o.trim()))) return idx;
  return shuffle(idx);
}

/* ============ QUIZ ============ */

  top.querySelector("#qX").onclick=()=>confirmSheet("Prekinuti test?",`Odgovori koje si već ${G("dala","dao","dao/la")} ostaju u statistici. Test možeš i da nastaviš kasnije sa početnog ekrana.`,"Prekini test",()=>{quiz=null;persistQuiz();go("test")},"Nastavi kasnije",()=>{quiz=null;go("home")});

    const order=quiz.orders[quiz.idx]||it.o.map((_,k)=>k); const opts=h(`<div class="opts" role="group"></div>`);
    order.forEach((k,pos)=>opts.append(h(`<button class="opt" data-k="${k}"><span class="k notr">${"ABCDEF"[pos]}</span><span class="grow">${esc(it.o[k])}</span></button>`)));

    paint();

function fitCard(){ // pitanje + odgovori + objašnjenje moraju da stanu na ekran; ako ne staju, sve se malo smanji
  const c=document.querySelector("body.focus .qcard"); if(!c)return;
  c.classList.remove("c1","c2","c3","c4","c5","scroll");
  const over=()=>c.scrollHeight>c.clientHeight+1;
  for(const k of ["c1","c2","c3","c4","c5"]){ if(!over())return; c.classList.add(k) }
  if(over()) c.classList.add("scroll");
}
window.addEventListener("resize",()=>{ if(document.body.classList.contains("focus")) fitCard() });
function revealFeedback(v){
  if(document.body.classList.contains("focus")){ requestAnimationFrame(()=>{ const c=v.querySelector(".qcard.scroll"), fb=v.querySelector(".fb"); if(c&&fb) c.scrollTo({top:c.scrollHeight,behavior:"smooth"}) }); return } // posle odgovora objašnjenje mora da se vidi iznad dugmeta „Sledeće pitanje”
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ const fb=v.querySelector(".fb"); if(!fb)return; const r=fb.getBoundingClientRect();
    const foot=v.querySelector(".sticky-foot"); const limit=(foot?foot.getBoundingClientRect().top:innerHeight-90)-12;
    if(r.bottom>limit){ const top=document.querySelector("header.top"); const maxUp=r.top-((top?top.getBoundingClientRect().bottom:0)+8); window.scrollBy({top:Math.max(0,Math.min(r.bottom-limit,maxUp)),behavior:"smooth"}) } }));
}
function tickTimer(){const el=document.getElementById("timer"); if(!quiz||!el)return; const left=Math.max(0,quiz.timed-Math.floor((Date.now()-quiz.start)/1000));
  el.textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0"); el.classList.toggle("low",left<60); if(left<=0){clearInterval(timerInt);timerInt=null;toast("Vreme je isteklo");finishQuiz()}}
function submitMc(it,sel){const ok=sel.length===it.c.length&&sel.every(k=>it.c.includes(k)); quiz.answers[quiz.idx]={sel,ok}; quiz.sel=[]; quiz.justAnswered=true; record(it.id,ok); persistQuiz(); go("quiz",{keep:true})}
function next(){ if(quiz.idx+1<quiz.items.length){quiz.idx++;quiz.reveal=false;persistQuiz();go("quiz")} else finishQuiz() }
function finishQuiz(){ if(!quiz)return; const end=Date.now();
  const n=quiz.items.length, k=quiz.answers.filter(a=>a&&a.ok).length;
  const prev=S.hist.slice().reverse().find(x=>x.mode===quiz.mode&&quiz.mode!=="ids"&&(quiz.mode!=="ct"||x.ctid===quiz.ctid));
  S.hist.push({t:end,mode:quiz.mode,title:quiz.title,n,k,dur:end-quiz.start,ctid:quiz.ctid}); S.hist=S.hist.slice(-120);
  if(quiz.ctid){ const r=S.ct[quiz.ctid]||{n:0,best:0}; r.n=(r.n||0)+1; r.last=k; r.tot=n; r.best=Math.max(r.best||0,k); r.t=end; S.ct[quiz.ctid]=r; save() }
  quiz.end=end; lastResult={quiz,prev,celebrated:false}; quiz=null; persistQuiz(); go("results");
}

  row.append(b1,b2); v.append(row);
  const byArea={}; q.items.forEach((it,i)=>{const a=byArea[it.a]||(byArea[it.a]={n:0,k:0});a.n++;if(q.answers[i]&&q.answers[i].ok)a.k++});
  v.append(h(`<section class="flat">${Object.entries(byArea).map(([a,s])=>`<div class="kv"><span>${AREAS[a]}</span><b class="notr">${s.k} / ${s.n}</b></div>`).join("")}</section>`));

    const li=h(`<div class="li"><div class="row" style="align-items:flex-start"><span class="mark" style="color:${good?"var(--good)":"var(--bad)"}">${good?I.check:I.x}</span><div class="grow stack" style="gap:6px"><div class="q">${esc(it.q)}</div>${your}<div class="a">${it.t==="mc"?it.c.map(k=>esc(it.o[k])).join("; "):esc(it.list?it.list.join("; "):it.ans||"")}</div>${noteHTML(it)}${srcHTML(it)}<div class="row wrap"><button class="link quiet st">${isBm(it.id)?I.starF+"Sačuvano":I.star+"Sačuvaj"}</button><button class="link quiet rp">${I.alert}Prijavi grešku</button></div></div></div></div>`);

  v.append(list);
}

function surprise(){
  const items=pick(TESTABLE,3); let idx=0, ok=0;
  const s=sheet(`<div id="sp"></div>`,"Iznenadi me"); document.body.appendChild(s);
  const box=s.querySelector("#sp");
  function draw(){
    box.innerHTML="";
    if(idx>=items.length){box.append(h(`<div class="stack" style="align-items:center;text-align:center;padding:10px 0 4px"><div class="score notr">${ok}/3</div><div class="muted">${ok===3?"Savršeno!":"Pogrešna pitanja su dodata u „Moje greške”."}</div><div class="grid2" style="width:100%"><button class="btn" id="c1">Zatvori</button><button class="btn primary" id="c2">Još 3</button></div></div>`));
      box.querySelector("#c1").onclick=()=>{s.remove();if(current==="home")go("home",{keep:true})}; box.querySelector("#c2").onclick=()=>{s.remove();surprise()}; applyScript(box); if(ok===3)confetti(); return}
    const it=items[idx]; const order=optOrder(it);
    const c=h(`<div class="stack"><div class="eyebrow">Iznenadi me · ${idx+1}/3</div>${badgesHTML(it,true)}<div class="qtext">${esc(it.q)}</div>${it.c.length>1?`<div class="qhint">Više tačnih: ${it.c.length}</div>`:""}<div class="opts"></div></div>`);
    const opts=c.querySelector(".opts"); let sel=[];
    order.forEach((k,p)=>opts.append(h(`<button class="opt" data-k="${k}"><span class="k notr">${"ABCDEF"[p]}</span><span class="grow">${esc(it.o[k])}</span></button>`)));
    const finish=()=>{const good=sel.length===it.c.length&&sel.every(k=>it.c.includes(k)); if(good)ok++; record(it.id,good);
      opts.querySelectorAll(".opt").forEach(b=>{const k=+b.dataset.k;b.disabled=true;b.className="opt "+(it.c.includes(k)?"ok pop":sel.includes(k)?"no shake":"dim")});
      const fb=h(`<div class="fb ${good?"ok":"no"}"><div class="t">${good?I.check+" Tačno":I.x+" Netačno"}</div>${mcExplain(it,good)}${noteHTML(it)}${srcHTML(it)}</div>`);
      const nb=h(`<button class="btn primary block">${idx<2?"Dalje":"Rezultat"}</button>`); nb.onclick=()=>{idx++;draw()}; c.append(fb,nb); applyScript(fb); applyScript(nb)};
    opts.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const k=+b.dataset.k; if(it.c.length===1){sel=[k];finish()} else {sel=sel.includes(k)?sel.filter(x=>x!==k):sel.concat(k);b.classList.toggle("sel"); if(sel.length===it.c.length)finish()}});
    box.append(c); applyScript(box);
  }
  draw();
}

function startDeck(ids,title){
  const its=quizzable(ids);
  if(!its.length){toast("Ovde još nema pitanja");return}
  const order=its.map(i=>({i,w:weight(i)*Math.random()})).sort((a,b)=>b.w-a.w).map(x=>x.i);
  fcs={title,queue:order.map(i=>i.id),pos:0,known:0,unknown:0,orders:{},ans:null,sel:[]}; go("deck");
}
function viewDeck(v){
  if(!fcs){go("cards");return}
  if(fcs.pos>=fcs.queue.length){
    keepAwake(false);
    v.append(h(`<section class="card stack" style="align-items:center;text-align:center"><div class="eyebrow">${esc(fcs.title)}</div><div class="score notr">${fcs.known}</div><div class="muted">tačnih odgovora · ${fcs.unknown} ${fcs.unknown===1?"greška":"grešaka"} (ponovljene su)</div></section>`));
    const b=h(`<div class="grid2"><button class="btn">Nazad</button><button class="btn primary">Ponovo</button></div>`);
    b.children[0].onclick=()=>{fcs=null;go("cards")}; b.children[1].onclick=()=>startDeck(fcs.queue.filter((x,i,a)=>a.indexOf(x)===i),fcs.title); v.append(b);
    if(fcs.known>=10&&fcs.unknown===0&&!fcs.cel){fcs.cel=true;confetti()} return;
  }
  keepAwake(true);
  const it=BYID[fcs.queue[fcs.pos]]; const st=S.st[it.id]||{b:0}; const ans=fcs.ans; const multi=it.c.length>1;
  const order=fcs.orders[it.id]||(fcs.orders[it.id]=optOrder(it));
  const top=h(`<div class="qtop"><button class="iconbtn" id="dX" aria-label="Zatvori vežbanje">${I.x}</button><div class="dots"><div class="bar thin grow"><i style="width:${Math.min(100,fcs.pos/fcs.queue.length*100)}%"></i></div></div><span class="qnum notr">${fcs.pos+1}/${fcs.queue.length}</span>${it.num?"":`<button class="iconbtn ${isBm(it.id)?"on":""}" id="dS" aria-label="Sačuvaj">${isBm(it.id)?I.starF:I.star}</button>`}</div>`);
  top.querySelector("#dX").onclick=()=>{fcs=null;go("cards")};

  const opts=h(`<div class="opts" role="group"></div>`);
  order.forEach((k,pos)=>opts.append(h(`<button class="opt" data-k="${k}"><span class="k notr">${"ABCDEF"[pos]}</span><span class="grow">${esc(it.o[k])}</span></button>`)));
  card.append(opts); v.append(card);
  const paint=()=>opts.querySelectorAll(".opt").forEach(b=>{const k=+b.dataset.k; b.className="opt";
    if(ans){b.classList.add(it.c.includes(k)?"ok":ans.sel.includes(k)?"no":"dim");b.disabled=true}
    else if(fcs.sel.includes(k))b.classList.add("sel")});
  paint();
  let chk=null;
  const submit=sel=>{ const ok=sel.length===it.c.length&&sel.every(k=>it.c.includes(k));
    record(it.id,ok); fcs.ans={sel,ok,fresh:true}; fcs.sel=[];
    if(ok)fcs.known++; else {fcs.unknown++; fcs.queue.splice(Math.min(fcs.queue.length,fcs.pos+4),0,it.id)}
    go("deck",{keep:true}) };
  opts.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ if(ans)return; const k=+b.dataset.k;
    if(!multi) submit([k]); else {fcs.sel=fcs.sel.includes(k)?fcs.sel.filter(x=>x!==k):fcs.sel.concat(k); paint(); if(chk)chk.disabled=!fcs.sel.length} });
  if(multi&&!ans){chk=h(`<button class="btn primary block" disabled>Proveri</button>`); chk.onclick=()=>submit(fcs.sel.slice()); card.append(chk)}
  if(ans){
    if(ans.fresh){ ans.fresh=false; opts.querySelectorAll(".opt.ok").forEach(b=>b.classList.add("pop")); if(!ans.ok) opts.querySelectorAll(".opt.no").forEach(b=>b.classList.add("shake")); revealFeedback(v) }
    const lvl=(S.st[it.id]||{b:0}).b||0;
    const fb=h(`<div class="fb ${ans.ok?"ok":"no"}"><div class="t">${ans.ok?I.check+" Tačno":I.x+" Netačno – vratiće se za nekoliko pitanja"}</div>${mcExplain(it,ans.ok)}${noteHTML(it)}${it.num?`<div class="src">${esc(it.srcText||"")}</div>`:srcHTML(it)}<div class="row" style="justify-content:space-between"><div class="boxes" aria-label="Nivo znanja ${lvl} od 5">${[1,2,3,4,5].map(n=>`<i class="${lvl>=n?"on":""}"></i>`).join("")}</div>${it.num?"":`<button class="link quiet" id="rep">${I.alert}Prijavi grešku</button>`}</div></div>`);
    const rp=fb.querySelector("#rep"); if(rp) rp.onclick=()=>reportSheet(it);
    card.append(fb);
    const nx=h(`<div class="sticky-foot"><button class="btn primary block">Sledeće pitanje</button></div>`);
    nx.querySelector("button").onclick=()=>{fcs.pos++; fcs.ans=null; go("deck")}; v.append(nx);
  } else card.append(h(`<div class="muted small kbdhint">Tastatura: <span class="kbd">A</span>–<span class="kbd">D</span>, zatim <span class="kbd">Enter</span></div>`));
}

function itemRow(it,open,terms){
  const mk=s=>terms?markText(esc(s),terms):esc(s);
  const r=h(`<div class="li click"><div class="row" style="align-items:flex-start"><div class="q grow">${mk(it.q)}</div><button class="link quiet st" aria-label="Sačuvaj" style="padding:0">${isBm(it.id)?I.starF:I.star}</button></div><div class="more" ${open?"":"hidden"}>${it.t==="mc"?`<div class="muted small">${it.o.map((o,k)=>`${"ABCDEF"[k]}) ${mk(o)}`).join("<br>")}</div>`:""}<div class="answer" style="margin-top:6px">${it.t==="mc"?`<b>${it.c.map(k=>mk(it.o[k])).join("<br>")}</b>`:it.list?`<ul>${it.list.map(x=>`<li>${mk(x)}</li>`).join("")}</ul>`:mk(it.ans||"")}</div>${noteHTML(it)}${srcHTML(it)}</div>${badgesHTML(it,false)}</div>`);
  r.onclick=e=>{ if(e.target.closest(".st"))return; const m=r.querySelector(".more");m.hidden=!m.hidden};
  const st=r.querySelector(".st"); st.onclick=()=>{toggleBm(it.id);st.innerHTML=isBm(it.id)?I.starF:I.star};
  return r;
}
function markText(html,terms){
  let out=html;
  terms.forEach(t=>{ if(t.length<2)return;
    const pat=t.split("").map(ch=>({c:"[cčć]",s:"[sš]",z:"[zž]",d:"(?:dj|đ|d)"}[ch]||ch.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"))).join("");
    const rx=new RegExp("("+pat+")","gi");
    out=out.replace(/(<[^>]+>)|([^<]+)/g,(m,tag,txt)=>tag?tag:txt.replace(rx,"<mark>$1</mark>"));
  });
  return out;
}

let lastQ="", lastF="all";
function viewSearch(v){
  v.append(h(`<div class="sw"><span>${I.search}</span><input class="field" id="sq" type="search" inputmode="search" autocomplete="off" placeholder="Traži pojam, npr. dekubitus, 30:2, Vlada…" aria-label="Pretraga"></div>`));
  const chips=h(`<div class="chips"></div>`);
  [["all","Sve"],["nega","Nega"],["zastita","Zdr. zaštita"],["ustav","Ustav"],["exam","Sa pravih rokova"],["bm","Sačuvana"]].forEach(([k,l])=>{const c=h(`<button class="chip" aria-pressed="${lastF===k}">${l}</button>`);c.onclick=()=>{lastF=k;chips.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed","false"));c.setAttribute("aria-pressed","true");run()};chips.append(c)});
  v.append(chips);
  const out=h(`<div class="list"></div>`); v.append(out);
  const inp=v.querySelector("#sq"); inp.value=lastQ;
  const IDX=ITEMS.map(i=>norm([i.q,i.ans||"",(i.o||[]).join(" "),(i.list||[]).join(" ")].join(" ")));
  function run(){lastQ=inp.value; const q=norm(inp.value.trim()); out.innerHTML="";
    const filt=i=>lastF==="all"||i.a===lastF||(lastF==="exam"&&i.x)||(lastF==="bm"&&isBm(i.id));
    const browse=lastF==="bm"||lastF==="exam";
    if(q.length<2&&!browse){out.append(h(`<div class="empty">Upiši bar 2 slova. Pretraga radi i bez kvačica (č, ć, š, ž).</div>`));applyScript(out);return}
    const terms=q.split(/\s+/).filter(Boolean); const res=[];
    for(let i=0;i<ITEMS.length&&res.length<80;i++){if(filt(ITEMS[i])&&terms.every(t=>IDX[i].includes(t)))res.push(ITEMS[i])}
    out.append(h(`<div class="muted small">${res.length>=80?"80+":res.length} rezultata</div>`));
    if(!res.length) out.append(h(`<div class="empty">Ništa nije pronađeno. Probaj kraću reč (npr. „dekubit” umesto „dekubitusa”).</div>`));
    res.forEach(it=>out.append(itemRow(it,true,terms.length?terms:null)));
    applyScript(out)}
  let t=null; inp.addEventListener("input",()=>{clearTimeout(t);t=setTimeout(run,150)}); run();
  if(window.matchMedia("(hover:hover)").matches) setTimeout(()=>inp.focus(),100);
}

function onboarding(){
